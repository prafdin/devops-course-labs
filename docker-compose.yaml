version: '3.8'

services:
  db:
    image: mariadb:10.11
    container_name: catty_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: mypass
      MYSQL_DATABASE: catty_reminders
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network

  backend:
    image: ghcr.io/${REPO_LOWER}:${RELEASE_HASH}
    container_name: catty_backend
    restart: unless-stopped
    ports:
      - "8181:8181"
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=mypass
      - DB_NAME=catty_reminders
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db_data:
