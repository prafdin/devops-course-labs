version: '3.8'

services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: mypass
      MYSQL_DATABASE: catty_reminders
    volumes:
      - db_data:/var/lib/mysql

  backend:
    image: ghcr.io/kuzminstanislav/catty-reminders-app:latest
    restart: unless-stopped
    ports:
      - "8181:8181"
    depends_on:
      - db

volumes:
  db_data:
