name: catty-reminders

services:
  database:
    image: mariadb:11
    container_name: catty-db
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "3306"
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - backend

  web:
    image: "${APP_IMAGE:-catty-app:latest}"
    container_name: catty-app
    restart: unless-stopped
    expose:
      - "8181"
    ports:
      - "${APP_PORT:-8181}:8181"
    volumes:
      - ./config.json:/app/config.json:ro
    depends_on:
      database:
        condition: service_started
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  mariadb_data:
