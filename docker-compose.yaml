services:
  app:
    image: ${IMAGE:-ghcr.io/vadimkadkdoofjf/catty-reminders-app:latest}
    restart: unless-stopped
    ports:
      - "8181:8181"
    env_file:
      - .env
    environment:
      - DEPLOY_REF=${DEPLOY_REF:-latest}
    volumes:
      - ./config.json:/catty-reminders-app/config.json:ro
      - ./reminder_db.json:/catty-reminders-app/reminder_db.json
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
