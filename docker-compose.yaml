name: catty-reminders-app

services:
  app:
    image: ghcr.io/an664/catty-reminders-app:${APP_IMAGE_TAG}
    pull_policy: always
    restart: unless-stopped
    ports:
      - "8181:8181"
    depends_on:
      db:
        condition: service_healthy
    secrets:
      - mysql_root_password

  db:
    image: mysql:8.0
    pull_policy: missing
    restart: unless-stopped
    command:
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=64M
      - --max-connections=50
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      MYSQL_DATABASE: catty_reminders
    volumes:
      - catty-mysql-data:/var/lib/mysql
    secrets:
      - mysql_root_password
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$(cat /run/secrets/mysql_root_password)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  catty-mysql-data:

secrets:
  mysql_root_password:
    file: ./mysql_root_password.txt
