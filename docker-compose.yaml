version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: catty-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: catty_reminders
      MYSQL_USER: catty
      MYSQL_PASSWORD: cattypass
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - catty-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: ghcr.io/seredovasophia/catty-reminders-app:latest
    container_name: catty-app
    ports:
      - "8181:8181"
    depends_on:
      - db
    networks:
      - catty-network
    restart: unless-stopped

volumes:
  db-data:

networks:
  catty-network:
    driver: bridge
