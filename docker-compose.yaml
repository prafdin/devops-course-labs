services:
  db:
    image: mariadb:10.11
    container_name: catty_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: mypass
      MYSQL_DATABASE: catty_reminders
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build: ./backend
    container_name: catty_backend
    restart: unless-stopped
    ports:
      - "8181:8181"
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: mypass
      DB_NAME: catty_reminders
    depends_on:
      - db

volumes:
  db_data:
