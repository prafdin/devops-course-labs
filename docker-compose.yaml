services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: mypass
      MYSQL_DATABASE: catty_reminders
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pmypass"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    image: ghcr.io/sofiastepanova/catty-reminders-app:${DEPLOY_REF}
    ports:
      - "8181:8181"
    environment:
      - DEPLOY_REF=${DEPLOY_REF}
    depends_on:
      db:
        condition: service_healthy
    restart: always

volumes:
  db_data:
