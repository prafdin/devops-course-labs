services:
  catty_backend:
    image: ghcr.io/vadimkadkdoofjf/catty-reminders-app:${RELEASE_HASH}
    container_name: catty_backend

    restart: always

    ports:
      - "8181:8181"

    depends_on:
      - db

    environment:
      RELEASE_HASH: ${RELEASE_HASH}

      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: catty_reminders
      MYSQL_USER: ct
      MYSQL_PASSWORD: ctpass

      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ct
      DB_PASSWORD: ctpass
      DB_NAME: catty_reminders

  db:
    image: mariadb:10.11
    container_name: catty_db

    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: catty_reminders
      MYSQL_USER: ct
      MYSQL_PASSWORD: ctpass

    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
