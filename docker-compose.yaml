services:
  db:
    image: mariadb:10.11
    container_name: catty_db
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: catty_reminders
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: catty_backend
    ports:
      - "8181:8181"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: catty_reminders
    command: uvicorn app.main:app --host 0.0.0.0 --port 8181
