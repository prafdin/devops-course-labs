services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: catty_reminders
    volumes:
      - db_data:/var/lib/mysql

  app:
    image: ghcr.io/zurmes/catty-reminders-app:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "8181:8181"
    depends_on:
      - db

volumes:
  db_data:
