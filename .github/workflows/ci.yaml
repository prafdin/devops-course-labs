name: CI Pipeline

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build project
      run: dotnet build --no-restore --configuration Release

    - name: Run unit tests
      run: dotnet test --no-build --configuration Release --logger "junit;LogFileName=test-results.xml"

    - name: Upload test results artifact
      if: always() # Загрузка отчета даже при падении тестов для анализа ошибок
      uses: actions/upload-artifact@v4
      with:
        name: test_result
        path: '**/TestResults/test-results.xml'

    # Сборка и отправка образа в GHCR (выполняется только в репозитории форка)
    - name: Log in to GitHub Container Registry
      if: github.repository == 'Jupiter0303/csharp-example'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      if: github.repository == 'Jupiter0303/csharp-example'
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ghcr.io/jupiter0303/csharp-example:${{ github.sha }}
          ghcr.io/jupiter0303/csharp-example:latest
