name: CI

on:
  push:
    branches:
      - lab4
      - lab4_autotests*
  pull_request:
    branches:
      - lab4
      - lab4_autotests*

jobs:
  pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    services:
      mysql:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: mypass
          MYSQL_DATABASE: catty_reminders
          MYSQL_USER: ct
          MYSQL_PASSWORD: catty_pass_123
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Temporary swap config for tests
        run: |
          sed -i 's/"host": "db"/"host": "127.0.0.1"/' config.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Start app
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8181 &
          sleep 7

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        continue-on-error: true
        run: pytest --junitxml=test_result.xml

      - name: Revert config swap before build
        run: |
          git checkout config.json

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test_result
          path: test_result.xml

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert repository name to lowercase
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "REPO_LOWER=$REPO_LOWER" >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.REPO_LOWER }}:${{ github.sha }}
            ghcr.io/${{ env.REPO_LOWER }}:latest
          build-args: |
            DEPLOY_REF=${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: pipeline
    if: github.event_name == 'release' && github.event.action == 'published'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Get release commit hash
        run: |
          TAG=${{ github.event.release.tag_name }}
          HASH=$(git rev-parse $TAG^{commit} || git rev-list -n 1 $TAG)
          echo "RELEASE_HASH=$HASH" >> $GITHUB_ENV
      
      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      
      - name: Deploy to server
        env:
          SERVER_HOST: ${{ vars.DEPLOY_HOST }}
          SERVER_USER: ${{ vars.DEPLOY_USER }}
          SERVER_PORT: ${{ vars.DEPLOY_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          RELEASE_HASH: ${{ env.RELEASE_HASH }}
          REPO_NAME: ${{ github.repository }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh -p ${SERVER_PORT} -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_HOST "mkdir -p /home/qzm/Desktop/catty-reminders-app"
          scp -P ${SERVER_PORT} -o StrictHostKeyChecking=no docker-compose.yaml $SERVER_USER@$SERVER_HOST:/home/qzm/Desktop/catty-reminders-app/docker-compose.yaml
          chmod +x deploy.sh
          ./deploy.sh
