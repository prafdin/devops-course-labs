name: CI

on:
  push:
    branches:
      - lab4*
  pull_request:
    branches:
      - lab4*

jobs:
  pipeline:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: catty_reminders
          MYSQL_USER: ct
          MYSQL_PASSWORD: ctpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            nc -z 127.0.0.1 3306 && echo "MySQL is up" && exit 0
            sleep 2
          done
          echo "MySQL failed to start" && exit 1

      - name: Start app
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: ct
          DB_PASSWORD: ctpass
          DB_NAME: catty_reminders
        run: |
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8181 > app.log 2>&1 &
          
          for i in {1..30}; do
            curl -s http://localhost:8181/docs && echo "App is up" && break
            sleep 2
          done

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: ct
          DB_PASSWORD: ctpass
          DB_NAME: catty_reminders
        run: pytest --junitxml=test_result.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test_result
          path: test_result.xml
