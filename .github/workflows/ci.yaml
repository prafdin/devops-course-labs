name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: mypass
          MYSQL_DATABASE: catty_reminders
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pmypass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          python -m playwright install --with-deps chromium

      - name: Run tests
        run: |
          mkdir -p test-results
          cp config.json /tmp/catty-config.json
          trap 'cp /tmp/catty-config.json config.json' EXIT
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("config.json")
          config = json.loads(path.read_text())
          config["db_config"]["host"] = "127.0.0.1"
          path.write_text(json.dumps(config, indent=2) + "\n")
          PY
          uvicorn app.main:app --host 0.0.0.0 --port 8181 &
          python - <<'PY'
          import time
          import urllib.request

          for _ in range(30):
              try:
                  urllib.request.urlopen("http://127.0.0.1:8181/login", timeout=2).read()
                  break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit("app did not start")
          PY
          python -m pytest tests --junitxml=test-results/tests.xml

      - name: Upload test result
        uses: actions/upload-artifact@v4
        with:
          name: test_result
          path: test-results/*.xml

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/an664/catty-reminders-app:${{ github.sha }}
          build-args: |
            DEPLOY_REF=${{ github.sha }}
