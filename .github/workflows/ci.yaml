name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov playwright pytest-playwright
          playwright install chromium --with-deps
      
      - name: Create config files
        run: |
          mkdir -p /opt/catty-reminders
          echo '{"secret_key": "test", "users": [{"username": "test", "password": "test"}], "db_path": "/opt/catty-reminders/reminder_db.json"}' > /opt/catty-reminders/config.json
          echo '{"base_url": "http://localhost:8181", "users": [{"username": "test", "password": "test"}]}' > /opt/catty-reminders/inputs.json
      
      - name: Create test user
        run: |
          python -c "
          from tinydb import TinyDB
          db = TinyDB('/opt/catty-reminders/reminder_db.json')
          users = db.table('users')
          if not users.contains({'username': 'test'}):
              users.insert({'username': 'test', 'password': 'test'})
          print('✅ User created')
          "
      
      - name: Start server with debug
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8181 --log-level debug 2>&1 &
          sleep 5
          echo "=== LOGIN RESPONSE ==="
          curl -v -X POST http://localhost:8181/login -d "username=test&password=test" 2>&1
          echo "=== END ==="
      
      - name: Run all tests
        run: |
          export PYTHONPATH=$PYTHONPATH:$PWD
          export PLAYWRIGHT_HEADLESS=true
          pytest tests/ -v --junitxml=test_results.xml --tb=short
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test_result
          path: test_results.xml
