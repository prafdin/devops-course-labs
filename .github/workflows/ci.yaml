name: Python CI

on:
  push:
    branches: [ lab2 ]
  pull_request:
    branches: [ lab2 ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      [cite_start]uses: actions/checkout@v4 [cite: 105]

    - name: Set up Python
      [cite_start]uses: actions/setup-python@v5 [cite: 107]
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt [cite: 126]

    - name: Run tests
      # Запускаем pytest и записываем вывод в файл для артефакта
      run: |
        pytest > test_result.txt || echo "Tests failed, check logs" >> test_result.txt

    - name: Upload test results
      [cite_start]uses: actions/upload-artifact@v4 [cite: 98]
      with:
        name: test_result
        path: test_result.txt
