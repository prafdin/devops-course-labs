name: CI

on:
  push:
    branches: [ lab2, main, catty-reminders-app ]
  pull_request:
    branches: [ catty-reminders-app ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-playwright

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium

      - name: Start application
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8181 &
          sleep 5

      - name: Run tests
        run: |
          PYTHONPATH=${{ github.workspace }} pytest tests/ --junitxml=test_result.xml

      - name: Upload test results
        uses: actions/upload-artifact@v5
        with:
          name: test_result
          path: test_result.xml
