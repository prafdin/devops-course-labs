name: CI

on:
  push:
    branches:
      - 'lab3*'
  pull_request:
    branches:
      - 'lab3*'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Start app
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8181 &
          sleep 5
          curl -f http://localhost:8181 || exit 1

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest --junitxml=test_result.xml

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test_result
          path: test_result.xml
