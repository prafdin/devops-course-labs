name: Application CI

on:
  push:
    branches:
      - lab2
      - lab2_autotests*
  pull_request:
    branches:
      - lab2
      - lab2_autotests*

jobs:
  test-runner:
    runs-on: ubuntu-latest

    steps:
      - name: Fetch source code
        uses: actions/checkout@v4

      - name: Setup Python environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip' 

      - name: Install requirements
        run: |
          python3 -m pip install -U pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Launch application in background
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8181 > server_output.log 2>&1 &
          sleep 6 

      - name: Execute test suite
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest --junitxml=test_result.xml

      - name: Save test report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test_result
          path: test_result.xml
          retention-days: 7