name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      
      - name: Create config files
        run: |
          sudo mkdir -p /opt/catty-reminders
          echo '{"secret_key": "test", "users": [{"username": "test", "password": "test"}], "db_path": "/opt/catty-reminders/db.json"}' | sudo tee /opt/catty-reminders/config.json
          echo '{"users": [{"username": "test", "password": "test"}]}' | sudo tee /opt/catty-reminders/inputs.json
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov
      
      - name: Run tests
        run: |
          export PYTHONPATH=$PYTHONPATH:$PWD
          pytest tests/test_unit.py -v --junitxml=test_results.xml --tb=short
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test_result
          path: test_results.xml
