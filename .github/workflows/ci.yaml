name: CI Pipeline

on:
  push:
    branches: [ "lab2", "lab1" ]
  pull_request:
    branches: [ "lab2", "lab1" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest # Убедитесь, что у вас установлен фреймворк для тестов

      - name: Run tests
        run: |
          pytest > test_result.txt || true # || true чтобы шаг не упал, если тесты не пройдут, и артефакт загрузился

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test_result
          path: test_result.txt