name: CI Pipeline

on:
  push:
    branches: [ "lab4", "lab4*" ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root_pass
          MARIADB_USER: user
          MARIADB_PASSWORD: pass
          MARIADB_DATABASE: catty_db
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping -uroot -proot_pass" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mysql-connector-python pytest playwright pytest-playwright
          playwright install --with-deps chromium

      - name: Start application
        env:
          DB_HOST: 127.0.0.1
          DB_USER: user
          DB_PASS: pass
          DB_NAME: catty_db
        run: |
          python -m uvicorn app.main:app --host 0.0.0.0 --port 8181 &
          sleep 10

      - name: Run tests
        env:
          DB_HOST: 127.0.0.1
          DB_USER: user
          DB_PASS: pass
          DB_NAME: catty_db
        run: |
          python -m pytest tests/ -v --junitxml=test_result.xml

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: test_result
          path: test_result.xml

  build-and-push:
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,format=long,prefix=
            latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DEPLOY_REF=${{ github.sha }}
