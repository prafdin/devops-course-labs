name: CI Pipeline

on:
  push:
    branches: [ lab2 ]
  pull_request:
    branches: [ lab2 ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build project
      run: dotnet build --no-restore --configuration Release

    - name: Run unit tests
      run: dotnet test --no-build --configuration Release --logger "junit;LogFileName=test-results.xml"

    - name: Upload test results artifact
      if: always() # Загружаем отчет даже если тесты упали, чтобы видеть ошибки
      uses: actions/upload-artifact@v4
      with:
        name: test_result
        path: '**/TestResults/test-results.xml'
