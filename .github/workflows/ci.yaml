name: CI

on:
  push:
    branches:
      - lab3*
  pull_request:
    branches:
      - lab3*

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run app
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8181 &
          sleep 4

      - name: Tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest --junitxml=test_result.xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test_result
          path: test_result.xml


  docker-build:
    runs-on: ubuntu-latest
    needs: pipeline

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/vadimkadkdoofjf/catty-reminders-app:${{ github.sha }}
