name: CI Pipeline

on: [push, pull_request]

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Pytest
      # Запускаем юнит-тесты и перенаправляем весь вывод в файл test_result.txt
      run: |
        python -m pytest tests/test_unit.py --junitxml=test_result.xml

    - name: Upload test results
      uses: actions/upload-artifact@v4
      # if: always() гарантирует, что отчет загрузится даже если тесты упадут
      if: always()
      with:
        name: test_result
        path: test_result.xml
