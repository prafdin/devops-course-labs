name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Create config files
        run: |
          sudo mkdir -p /opt/catty-reminders
          echo '{"secret_key": "test", "users": [{"username": "test", "password": "test"}], "db_path": "/opt/catty-reminders/db.json"}' | sudo tee /opt/catty-reminders/config.json
          echo '{"base_url": "http://localhost:8181", "users": [{"username": "test", "password": "test"}]}' | sudo tee /opt/catty-reminders/inputs.json
          cp /opt/catty-reminders/config.json ./
          cp /opt/catty-reminders/inputs.json ./
          cat /opt/catty-reminders/inputs.json
          cat /opt/catty-reminders/config.json
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov playwright pytest-playwright
          playwright install chromium --with-deps
      
      - name: Start FastAPI server with debug
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8181 &
          sleep 5
          echo "=== LOGIN RESPONSE ==="
          curl -v http://localhost:8181/login 2>&1
          echo "=== END ==="
      
      - name: Run tests
        run: |
          export PYTHONPATH=$PYTHONPATH:$PWD
          export PLAYWRIGHT_HEADLESS=true
          pytest tests/ -v --junitxml=test_results.xml --cov=. --cov-report=xml --cov-report=html
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test_result
          path: |
            test_results.xml
            coverage.xml
            htmlcov/
          if-no-files-found: warn
