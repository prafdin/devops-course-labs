name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov playwright pytest-playwright
          playwright install chromium --with-deps
      
      - name: Create config files
        run: |
          mkdir -p /opt/catty-reminders
          cat > /opt/catty-reminders/config.json << 'EOF'
          {
            "db_path": "reminder_db.json",
            "secret_key": "Cats are awesome!",
            "users": {
              "heisenberg": "P@ssw0rd",
              "tester": "foobar123",
              "test": "test"
            }
          }
          EOF
          cat > /opt/catty-reminders/inputs.json << 'EOF'
          {"base_url": "http://localhost:8181", "users": [{"username": "test", "password": "test"}]}
          EOF
          cp /opt/catty-reminders/config.json ./
          cp /opt/catty-reminders/inputs.json ./
      
      - name: Start server
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8181 &
          sleep 5
      
      - name: Run all tests
        run: |
          export PYTHONPATH=$PYTHONPATH:$PWD
          export PLAYWRIGHT_HEADLESS=true
          pytest tests/ -v --junitxml=test_results.xml --tb=short
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test_result
          path: test_results.xml
