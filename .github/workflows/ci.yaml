name: CI

on:
  push:
    branches: [ lab4*, lab4-3 ]
  pull_request:
    branches: [ lab4*, lab4-3 ]

jobs:
  lint-dockerfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Lint Dockerfile with hadolint
        run: docker run --rm -i hadolint/hadolint < Dockerfile

  test:
    needs: lint-dockerfile
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: mypass
          MARIADB_DATABASE: catty_reminders
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt uvicorn pytest playwright
          playwright install --with-deps chromium
      
      - name: Wait for database
        run: |
          sudo apt-get update && sudo apt-get install -y mariadb-client
          for i in {1..30}; do
            if mariadb -h 127.0.0.1 -P 3306 -u root -pmypass -e "USE catty_reminders" 2>/dev/null; then
              echo "Database catty_reminders is ready"
              break
            fi
            echo "Waiting for database... $i"
            sleep 2
          done
      
      - name: Fix config for CI
        run: |
          sed -i 's/"host": "db"/"host": "127.0.0.1"/g' config.json
          sed -i 's/"host": "database"/"host": "127.0.0.1"/g' config.json
          echo "=== Fixed config.json ==="
          cat config.json
      
      - name: Start application
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8181 &
          sleep 10
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: root
          MYSQL_PASSWORD: mypass
          MYSQL_DATABASE: catty_reminders
      
      - name: Run tests
        run: pytest --junitxml=test_results.xml
        env:
          PYTHONPATH: ${{ github.workspace }}
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test_results.xml

  build:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            DEPLOY_REF=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/catty-reminders-app:latest
            ghcr.io/${{ github.repository_owner }}/catty-reminders-app:${{ github.sha }}
