name: CI

on:
  push:
    branches: [ lab3*, lab4* ]
  pull_request:
    branches: [ lab3*, lab4* ]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt pytest-playwright
          playwright install --with-deps chromium

      - name: Start MySQL for tests
        run: |
          docker run -d --name test-db \
            -e MYSQL_ROOT_PASSWORD=mypass \
            -e MYSQL_DATABASE=catty_reminders \
            -p 3306:3306 \
            mysql:8.0
          sleep 15
          sed -i 's/"host": "db"/"host": "localhost"/' config.json

      - name: Start Application
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8181 &
          sleep 5

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest --junitxml=test_result.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test_result
          path: test_result.xml

  build-and-push:
    needs: tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare Image Name
        id: prep
        run: |
          echo "repo_lower=sofiastepanova/catty-reminders-app" >> $GITHUB_OUTPUT

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: |
            ghcr.io/${{ steps.prep.outputs.repo_lower }}:lab4
            ghcr.io/${{ steps.prep.outputs.repo_lower }}:${{ github.sha }}
