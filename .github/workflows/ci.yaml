name: CI

on:
  push:
    branches:
      - lab4
      - lab4_autotests*
  pull_request:
    branches:
      - lab4
      - lab4_autotests*

jobs:
  pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    services:
      mysql:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: mypass
          MYSQL_DATABASE: catty_reminders
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Temporary swap config for tests
        run: |
          sed -i 's/"host": "db"/"host": "127.0.0.1"/' config.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Setup config
        run: |
          python3 -c "
          import json
          with open('config.json', 'r') as f:
              data = json.load(f)
          data['host'] = '127.0.0.1'
          with open('config.json', 'w') as f:
              json.dump(data, f, indent=4)
          "

      - name: Initialize Database and Create User
        run: |
          python3 -c "
          import sys
          import os
          sys.path.append(os.getcwd())
          from app.database import SessionLocal, engine, Base
          from app.models import User
          from app.utils.auth import get_password_hash
          
          Base.metadata.create_all(bind=engine)
          
          db = SessionLocal()
          users = [('heisenberg', 'P@ssw0rd'), ('tester', 'foobar123')]
          for u, p in users:
              db.add(User(username=u, password=get_password_hash(p)))
          db.commit()
          db.close()
          "

      - name: Start app
        run: |
          DB_HOST=127.0.0.1 nohup uvicorn app.main:app --host 127.0.0.1 --port 8181 > app.log 2>&1 &
          sleep 15

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest --junitxml=test_result.xml || (cat app.log && exit 1)

      - name: Revert config swap before build
        if: always()
        run: |
          git checkout config.json

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test_result
          path: test_result.xml

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert repository name to lowercase
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "REPO_LOWER=$REPO_LOWER" >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ env.REPO_LOWER }}:${{ github.sha }}
          build-args: |
            DEPLOY_REF=${{ github.sha }}
