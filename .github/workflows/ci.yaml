name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Create config files
        run: |
          sudo mkdir -p /opt/catty-reminders
          echo '{"secret_key": "test", "users": [{"username": "test", "password": "test"}], "db_path": "/opt/catty-reminders/db.json"}' | sudo tee /opt/catty-reminders/config.json
          echo '{"base_url": "http://localhost:8181", "users": [{"username": "test", "password": "test"}]}' | sudo tee /opt/catty-reminders/inputs.json
          cp /opt/catty-reminders/config.json ./
          cp /opt/catty-reminders/inputs.json ./
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov playwright pytest-playwright
          playwright install chromium --with-deps
      
      - name: Start FastAPI server with logging
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8181 2>&1 &
          SERVER_PID=$!
          sleep 5
          echo "=== Server logs ==="
          kill -0 $SERVER_PID 2>/dev/null && echo "Server is running" || echo "Server died"
          curl -v http://localhost:8181/login 2>&1 || true
          echo "=== End server logs ==="
      
      - name: Run tests
        run: |
          export PYTHONPATH=$PYTHONPATH:$PWD
          pytest tests/ -v --ignore=tests/test_ui.py --junitxml=test_results.xml --tb=short
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test_result
          path: test_results.xml
