name: CI Pipeline

on:
  push:
    branches: [ "lab4", "lab4*" ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-xml

      - name: Run Tests
        run: |
          pytest --junitxml=test-results.xml || true

      - name: Upload Test Results Artifact
        uses: actions/upload-artifact@v4
        with:
          name: test_result
          path: test-results.xml

      - name: Patch config.json for production
        run: |
          jq '.db_config.host = "db" | .db_config.user = "user" | .db_config.password = "pass" | .db_config.database = "catty_db"' config.json > config.tmp && mv config.tmp config.json

      - name: Prepare Repository Name to Lowercase
        id: prep
        run: echo "repo_lower=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.prep.outputs.repo_lower }}:latest
            ghcr.io/${{ steps.prep.outputs.repo_lower }}:${{ github.sha }}
          build-args: |
            DEPLOY_REF=${{ github.sha }}
