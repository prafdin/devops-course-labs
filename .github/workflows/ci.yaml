name: CI

on:
  push:
    branches: [ "lab3*" ]
  pull_request:
    branches: [ "lab3*" ]

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium
      - name: Start app
        run: |
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8181 &
          sleep 5
      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest --junitxml=test_result.xml
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test_result
          path: test_result.xml

  docker-build:
    runs-on: ubuntu-latest
    needs: pipeline
    if: success()
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Prepare repository name
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "REPO_LOWER=$REPO_LOWER" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          [cite_start]password: ${{ secrets.GITHUB_TOKEN }} [cite: 84, 87]

      - name: Build and push
        [cite_start]uses: docker/build-push-action@v5 [cite: 33, 88]
        with:
          [cite_start]context: . [cite: 32]
          [cite_start]push: true [cite: 34]
          [cite_start]tags: | [cite: 79]
            ghcr.io/${{ env.REPO_LOWER }}:${{ github.sha }}
            ghcr.io/${{ env.REPO_LOWER }}:latest
