name: CI

on:
  push:
    branches: [ lab4, lab4_autotests* ]

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Start Application
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8181 > uvicorn.log 2>&1 &
          sleep 5
          # Проверяем, что приложение запустилось
          curl -f http://127.0.0.1:8181/ || cat uvicorn.log

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -c "import sys; print('PYTHONPATH:', sys.path)"
          pytest tests/test_unit.py tests/test_api.py -v --junitxml=test_result.xml || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test_result
          path: test_result.xml
          if-no-files-found: warn

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.prep.outputs.repo_lower }}:latest
            ghcr.io/${{ steps.prep.outputs.repo_lower }}:${{ github.sha }}
          build-args: |
            DEPLOY_REF=${{ github.sha }}

