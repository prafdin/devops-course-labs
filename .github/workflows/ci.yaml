name: Python CI

on:
  push:

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install pytest-playwright
    - name: Install Playwright browsers
      run: playwright install
    - name: Start FastAPI server
      run: |
        uvicorn app.main:app --host 0.0.0.0 --port 8181 &
        sleep 5
    - name: Run tests
      run: |
        export PYTHONPATH=$PYTHONPATH:$PWD
        pytest --junitxml=test_result.xml
    - name: Upload test results
      uses: actions/upload-artifact@v4
      with:
        name: test_result
        path: test_result.xml

  build-docker:
      needs: test
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - name: Login to GitHub Container Registry
          uses: docker/login-action@v4
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}
        - name: Build and push Docker image
          uses: docker/build-push-action@v5
          with:
            context: .
            push: true
            tags: |
              ghcr.io/ivandelibaltov/catty-reminders-app:${{ github.sha }}
              ghcr.io/ivandelibaltov/catty-reminders-app:latest
            build-args: |
              DEPLOY_REF=${{ github.sha }}
