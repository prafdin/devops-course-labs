name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov playwright
          playwright install chromium
      
      - name: Setup test environment
        run: |
          sudo mkdir -p /opt/catty-reminders
          sudo cp config.json /opt/catty-reminders/ 2>/dev/null || true
          sudo cp inputs.json /opt/catty-reminders/ 2>/dev/null || true
      
      - name: Run tests with JUnit report
        run: |
          pytest tests/ -v --junitxml=test_results.xml --tb=short
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test_result
          path: test_results.xml
