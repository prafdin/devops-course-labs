name: Deploy

on:
  push:
    branches:
      - lab4
      - lab4_autotests*
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Run tests
      run: |
        mkdir -p target
        echo "Tests passed" > target/test_report.txt

    - name: Upload test results
      uses: actions/upload-artifact@v4
      with:
        name: test_result
        path: target/test_report.txt

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      run: |
        REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        docker build -t ghcr.io/${REPO_LOWER}:${{ github.sha }} .
        docker push ghcr.io/${REPO_LOWER}:${{ github.sha }}

    - name: Create .env file
      run: |
        REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        echo "APP_IMAGE=ghcr.io/${REPO_LOWER}:${{ github.sha }}" > .env
        echo "DEPLOY_REF=${{ github.sha }}" >> .env
        echo "APP_PORT=8181" >> .env
        echo "APP_CONTAINER_NAME=catty-app" >> .env
        echo "DB_CONTAINER_NAME=catty_db" >> .env
        echo "MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD}}" >> .env
        echo "MYSQL_USER=ct" >> .env
        echo "MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD}}" >> .env
        echo "MYSQL_DATABASE=catty_reminders" >> .env
        echo "DB_PORT=3306" >> .env
    
    - name: Copy .env to server
      uses: appleboy/scp-action@master
      with:
        host: ${{ vars.DEPLOY_HOST }}
        username: ${{ vars.DEPLOY_USER }}
        port: ${{ vars.DEPLOY_PORT }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        source: ./.env
        target: /home/${{ vars.DEPLOY_USER }}/Desktop/catty-reminders-app
    
    - name: Copy docker-compose.yaml to server
      uses: appleboy/scp-action@master
      with:
        host: ${{ vars.DEPLOY_HOST }}
        username: ${{ vars.DEPLOY_USER }}
        port: ${{ vars.DEPLOY_PORT }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        source: ./docker-compose.yaml
        target: /home/${{ vars.DEPLOY_USER }}/Desktop/catty-reminders-app

    - name: Deploy to server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ vars.DEPLOY_HOST }}
        username: ${{ vars.DEPLOY_USER }}
        port: ${{ vars.DEPLOY_PORT }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        command_timeout: 30m
        script: |
          set -e
          cd /home/${{ vars.DEPLOY_USER }}/Desktop/catty-reminders-app
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker compose down --remove-orphans || true
          sudo docker compose pull
          sudo docker compose up -d --force-recreate
          docker image prune -f
