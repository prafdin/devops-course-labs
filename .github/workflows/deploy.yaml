name: Deploy

on:
  release:
    types: [published]
  push:
    branches:
      - lab4 

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Get release commit hash
      run: |
        TARGET="${{ github.event.release.target_commitish }}"
        
        if [ -n "$TARGET" ]; then
          if [[ "$TARGET" =~ ^[0-9a-f]{40}$ ]]; then
            HASH="$TARGET"
          else
            HASH=$(git rev-parse "origin/$TARGET" 2>/dev/null || git rev-parse "$TARGET" 2>/dev/null || echo "${{ github.sha }}")
          fi
        else
          HASH="${{ github.sha }}"
        fi
        
        echo "Calculated RELEASE_HASH: $HASH"
        echo "RELEASE_HASH=$HASH" >> $GITHUB_ENV
    
    - name: Setup SSH Agent
      uses: webfactory/ssh-agent@v0.7.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
    
    - name: Deploy to server
      env:
        SERVER_HOST: ${{ secrets.SERVER_HOST }}
        SERVER_USER: ${{ secrets.SERVER_USER }}
        SERVER_PORT: ${{ secrets.SERVER_PORT }}
        RELEASE_HASH: ${{ env.RELEASE_HASH }}
        REPO_NAME: ${{ github.repository }}
        MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD || 'root' }}
        MYSQL_USER: ${{ secrets.MYSQL_USER || 'ct' }}
        MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD || 'ctpass' }}
      run: |
        scp -P $SERVER_PORT -o StrictHostKeyChecking=no docker-compose.yaml $SERVER_USER@$SERVER_HOST:/home/vboxuser/catty-reminders-app/docker-compose.yaml
        chmod +x scripts/deploy.sh
        ./scripts/deploy.sh
