name: Deploy

on:
  release:
    types: [published]
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches:
      - lab4

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'lab4') }}
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: course.prafdin.ru
          port: 22
          username: qzm
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /home/qzm/Desktop/catty-reminders-app
            git fetch origin
            git checkout lab4
            git pull origin lab4
            
            echo "REPO_LOWER=ghcr.io/kuzminstanislav/catty-reminders-app" > .env
            echo "RELEASE_HASH=latest" >> .env
            
            echo "${{ secrets.GITHUB_TOKEN }}" | sudo docker login ghcr.io -u KuzminStanislav --password-stdin
            
            sudo docker compose pull
            sudo docker compose --env-file .env up -d --remove-orphans --force-recreate
            
            for i in {1..30}; do
              if curl -fsS http://127.0.0.1:8181/ >/dev/null || curl -I http://127.0.0.1:8181/login 2>&1 | grep -q "200"; then
                echo "App is healthy"
                exit 0
              fi
              echo "Waiting for app... ($i/30)"
              sleep 3
            done
            sudo docker compose logs backend
            exit 1
