name: CD - Deploy to Server

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Executing remote ssh commands
        uses: appleboy/ssh-action@v1
        with:
          host: course.prafdin.ru
          username: qzm
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 3149
          script: |
            cd ~/Desktop/catty-reminders-app
            
            git fetch origin
            git reset --hard ${{ github.event.release.target_commitish }}

            echo "DEPLOY_REF=${{ github.event.release.target_commitish }}" > .env
            echo "${{ github.event.release.target_commitish }}" > version.txt
            
            if [ ! -d ".venv" ]; then python3 -m venv .venv; fi
            source .venv/bin/activate
            pip install -r requirements.txt
            
            sudo systemctl restart app.service
            
            sleep 5
            if ! systemctl is-active --quiet app.service; then
              echo "ERROR: app.service failed to start!"
              journalctl -u app.service -n 20
              exit 1
            fi
