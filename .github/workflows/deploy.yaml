name: CD

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Image Name
        id: prep
        run: echo "repo_lower=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
      - name: Deploy via SSH
        env:
          REPO_LOWER: ${{ steps.prep.outputs.repo_lower }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GITHUB_ACTOR: ${{ github.actor }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: course.prafdin.ru
          username: light
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 3137
          envs: REPO_LOWER, GHCR_PAT, GITHUB_ACTOR
          script: |
            IMAGE="ghcr.io/${REPO_LOWER}:latest"
            CONTAINER_NAME="catty-container"
            
            echo "Logging in to GHCR..."
            echo "$GHCR_PAT" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            
            echo "Pulling image: $IMAGE"
            docker pull $IMAGE
            
            docker stop $CONTAINER_NAME || true
            docker rm $CONTAINER_NAME || true
            
            docker run -d \
              --name $CONTAINER_NAME \
              -p 8181:8181 \
              --restart unless-stopped \
              $IMAGE
            
            docker image prune -f
