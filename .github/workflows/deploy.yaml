name: CD

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Получаем точный хэш коммита релиза и переводим имя репозитория в нижний регистр
      - name: Get config details
        run: |
          echo "IMAGE_LC=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "COMMIT_SHA=$(git rev-parse HEAD)" >> $GITHUB_ENV

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: "course.prafdin.ru"
          username: "kali"
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 2258
          envs: GITHUB_TOKEN,GITHUB_ACTOR,IMAGE,DEPLOY_REF
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            GITHUB_ACTOR: ${{ github.actor }}
            IMAGE: ghcr.io/${{ env.IMAGE_LC }}:${{ env.COMMIT_SHA }}
            DEPLOY_REF: ${{ env.COMMIT_SHA }}
          script: |
            cd /home/kali/catty-reminders-app
            bash scripts/deploy.sh
#
