name: CD Pipeline

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy docker-compose.yaml
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}

          source: "docker-compose.yaml"

          target: "/home/${{ secrets.SSH_USER }}/catty-app"

      - name: Deploy application
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}

          script: |
            export DEPLOY_REF="${{ github.sha }}"

            echo "DEPLOY_REF=${{ github.sha }}" > .env

            echo "${{ secrets.GH_PAT }}" | docker login ghcr.io -u exhaustion666 --password-stdin

            cd /home/${{ secrets.SSH_USER }}/catty-reminders-app

            for i in {1..30}; do
              if docker pull ghcr.io/exhaustion666/catty-reminders-app:${DEPLOY_REF}; then
                break
              fi


              sleep 10
            done

            docker compose down || true

            docker compose pull

            docker compose up -d --force-recreate

            docker image prune -af || true
