name: Deploy

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy through SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_SHA: ${{ github.sha }}
          SSH_HOST: course.prafdin.ru
          SSH_PORT: "26311"
          SSH_USER: root
          DEPLOY_DIR: /opt/catty-reminders-app
        run: |
          set -Eeuo pipefail

          key_file="$(mktemp)"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          chmod 600 "$key_file"

          ssh -i "$key_file" \
            -p "$SSH_PORT" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            "$SSH_USER@$SSH_HOST" \
            "DEPLOY_DIR='$DEPLOY_DIR' mkdir -p '$DEPLOY_DIR'"

          scp -i "$key_file" \
            -P "$SSH_PORT" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            docker-compose.yaml \
            "$SSH_USER@$SSH_HOST:$DEPLOY_DIR/docker-compose.yaml"

          ssh -i "$key_file" \
            -p "$SSH_PORT" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            "$SSH_USER@$SSH_HOST" \
            "DEPLOY_DIR='$DEPLOY_DIR' DEPLOY_SHA='$DEPLOY_SHA' GHCR_TOKEN='$GHCR_TOKEN' bash -s" <<'REMOTE'
          set -Eeuo pipefail

          printf '%s\n' "$GHCR_TOKEN" | docker login ghcr.io -u an664 --password-stdin

          systemctl stop catty-reminders-app.service || true
          systemctl disable catty-reminders-app.service || true

          docker rm -f catty-reminders-app || true

          printf 'APP_IMAGE_TAG=%s\nDEPLOY_REF=%s\n' "$DEPLOY_SHA" "$DEPLOY_SHA" > "$DEPLOY_DIR/.env"

          docker compose --env-file "$DEPLOY_DIR/.env" -f "$DEPLOY_DIR/docker-compose.yaml" pull
          docker compose --env-file "$DEPLOY_DIR/.env" -f "$DEPLOY_DIR/docker-compose.yaml" up -d

          for _ in $(seq 1 30); do
            if docker compose --env-file "$DEPLOY_DIR/.env" -f "$DEPLOY_DIR/docker-compose.yaml" exec -T app \
              python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8181/login', timeout=2).read()" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done

          docker compose --env-file "$DEPLOY_DIR/.env" -f "$DEPLOY_DIR/docker-compose.yaml" ps
          exit 1
          REMOTE
