name: Deploy

on:
  release:
    types: [published, created]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Get release commit hash
      id: release_vars
      run: |
        TAG=${{ github.event.release.tag_name }}
        HASH=$(git rev-parse "$TAG^{commit}" 2>/dev/null || git rev-parse "$TAG")
        echo "RELEASE_HASH=$HASH" >> $GITHUB_ENV
    
    - name: Deploy to server via Native SSH (Base64 Fix)
      env:
        DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
        RELEASE_HASH: ${{ env.RELEASE_ENV || env.RELEASE_HASH }}
        IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}
        DOCKER_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_ACTOR: ${{ github.actor }}
        SSH_KEY_BASE64: ${{ secrets.SSH_PRIVATE_KEY }}
      run: |
        mkdir -p ~/.ssh
        echo "$SSH_KEY_BASE64" | base64 -d > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        
        ssh-keyscan -p ${DEPLOY_PORT} ${DEPLOY_HOST} >> ~/.ssh/known_hosts
        chmod +x deploy.sh
        
        SSH_AUTH_SOCK="" exec ssh -i ~/.ssh/id_rsa -p ${DEPLOY_PORT} -o StrictHostKeyChecking=no ${DEPLOY_USER}@${DEPLOY_HOST} "bash -s" < deploy.sh
