name: CD

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      
      - name: Deploy on server
        run: |
          ssh -p 3132 nyanya@course.prafdin.ru << 'EOF'
            cd /opt/catty-reminders
            git fetch origin
            git reset --hard ${{ github.sha }}
            echo "DEPLOY_REF=${{ github.sha }}" | sudo tee .deploy_ref > /dev/null
            sudo chmod 644 .deploy_ref
            ./venv/bin/pip install -r requirements.txt
            sudo systemctl restart catty-reminders
          EOF
