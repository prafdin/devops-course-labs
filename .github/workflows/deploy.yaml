name: Deploy

on:
  push:
    branches: [lab4]
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup SSH
      uses: webfactory/ssh-agent@v0.7.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
    
    - name: Deploy
      env:
        SERVER_HOST: course.prafdin.ru
        SERVER_USER: qzm
        SERVER_PORT: 3149
        REPO_NAME: ${{ github.repository }}
        # Хеш последнего коммита
        RELEASE_HASH: ${{ github.sha }}
      run: |
        export REPO_LOWER=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]')
        
        scp -P $SERVER_PORT -o StrictHostKeyChecking=no docker-compose.yaml $SERVER_USER@$SERVER_HOST:/home/$SERVER_USER/Desktop/catty-reminders-app/docker-compose.yaml
        
        ssh -p $SERVER_PORT -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_HOST \
        "REPO_LOWER=$REPO_LOWER RELEASE_HASH=$RELEASE_HASH bash /home/$SERVER_USER/Desktop/catty-reminders-app/deploy.sh"
