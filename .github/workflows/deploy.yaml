name: CD - Deploy to Server

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Executing remote ssh commands
        uses: appleboy/ssh-action@v1
        with:
          host: course.prafdin.ru
          username: qzm
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 3149
          script: |
            cd ~/Desktop/catty-reminders-app
            git fetch origin
            git reset --hard ${{ github.sha }}

            echo "DEPLOY_REF=${{ github.sha }}" > .env
            echo "${{ github.sha }}" > version.txt
            
            echo "DEPLOY_REF=${{ github.sha }}" | sudo tee /etc/catty-app-env > /dev/null

            if [ -f "requirements.txt" ]; then
                [ -d ".venv" ] || python3 -m venv .venv
                source .venv/bin/activate
                pip install -r requirements.txt
            fi
            
            sudo pkill -9 -f uvicorn || true
            sudo systemctl daemon-reload
            sudo systemctl restart app.service
