name: CD Pipeline

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Подключаемся по SSH и управляем Docker-контейнерами на виртуалке
    - name: Deploy Docker container via SSH
      uses: appleboy/ssh-action@v1
      with:
        host: course.prafdin.ru
        port: 3111
        username: alexander
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          # 1. Авторизуем Docker на виртуалке в реестре GHCR, используя временный токен
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          
          # 2. Скачиваем свежий образ нашего приложения
          docker pull ghcr.io/jupiter0303/csharp-example:${{ github.sha }}
          
          # 3. Останавливаем и удаляем старый контейнер (если он запущен)
          docker stop csharp-web-container || true
          docker rm csharp-web-container || true
          
          # 4. Запускаем новый контейнер на порту 8181 и передаем туда хэш коммита релиза
          docker run -d \
            -p 8181:8181 \
            --name csharp-web-container \
            -e DEPLOY_REF=${{ github.sha }} \
            --restart always \
            ghcr.io/jupiter0303/csharp-example:${{ github.sha }}
