name: CD Pipeline

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Convert repository name to lowercase
      id: prep
      run: echo "repo_lower=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

    - name: Deploy to Server via SSH
      uses: appleboy/ssh-action@v1.0.3
      env:
        GHCR_PAT: ${{ secrets.GHCR_PAT }}
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.SSH_PORT }}
        envs: GHCR_PAT
        script: |
          set -e
          echo "check: is param here? ${#GHCR_PAT}"
          GHCR_PAT='${{ secrets.GHCR_PAT }}'
          echo "check2: is param here? ${#GHCR_PAT}"
          IMAGE_NAME="ghcr.io/${{ steps.prep.outputs.repo_lower }}:${{ github.sha }}"
          CONTAINER_NAME="catty-reminders"

          echo "Authorization in в GitHub Container Registry..."
          echo "$GHCR_PAT" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          echo "downloading image $IMAGE_NAME..."
          docker pull $IMAGE_NAME

          echo "stopping old container..."
          docker stop $CONTAINER_NAME || true
          docker rm -f $CONTAINER_NAME || true

          echo "launching a new container..."
          docker run -d \
            --name $CONTAINER_NAME \
            -p 8181:8181 \
            --restart always \
            $IMAGE_NAME

          echo "cleaning up old unused Docker images..."
          docker image prune -af || true
