name: CD

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: course.prafdin.ru
          username: light
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 3137
          envs: GHCR_PAT, GITHUB_REPOSITORY_OWNER, GITHUB_SHA
          script: |
            docker stop catty-app || true
            docker rm catty-app || true

            sudo systemctl stop catty-app || true
            sudo systemctl disable catty-app || true

            echo "$GHCR_PAT" | docker login ghcr.io -u "$GITHUB_REPOSITORY_OWNER" --password-stdin

            docker pull ghcr.io/$GITHUB_REPOSITORY_OWNER/catty-app:latest

            docker run -d \
              --name catty-app \
              -p 8181:8181 \
              -e DEPLOY_REF=$GITHUB_SHA \
              --restart unless-stopped \
              ghcr.io/$GITHUB_REPOSITORY_OWNER/catty-app:latest
