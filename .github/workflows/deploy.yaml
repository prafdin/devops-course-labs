name: CD

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VM via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: course.prafdin.ru
          port: 3178
          username: user
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/user/catty-reminders-app
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u seredovasophia --password-stdin
            docker compose pull
            docker compose up -d
