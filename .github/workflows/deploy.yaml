name: Docker CD Deployment

on:
  workflow_run:
    workflows: ["Python CI and Docker Build"]
    branches: [ lab3 ]
    types:
      - completed

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Запускаем деплой только если CI тесты и сборка образа прошли успешно
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    
    steps:
    - name: Deploy via SSH Tunnel to Kali VM
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: course.prafdin.ru
        port: 2258
        username: kali
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          cd ~/catty-reminders-app
          
          # Синхронизируем файлы конфигурации (включая .env.example)
          git fetch origin lab3
          git reset --hard origin/lab3
          
          # Авторизуемся в GitHub Container Registry на целевой машине
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          
          # Скачиваем свежий образ контейнера, собранный на этапе CI
          docker pull ghcr.io/${{ github.repository }}:lab3
          
          # Безопасно останавливаем и удаляем старый контейнер, если он существует
          docker stop catty-test || true
          docker rm catty-test || true
          
          # Запускаем новый контейнер с подгрузкой локального файла .env
          docker run -d \
            -p 8181:8181 \
            --name catty-test \
            --env-file .env \
            --restart unless-stopped \
            ghcr.io/${{ github.repository }}:lab3
