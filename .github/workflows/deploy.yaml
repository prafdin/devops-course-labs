name: Deploy
on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via script
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: course.prafdin.space
          username: lenya
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 3141
          script: bash /opt/catty-reminders-app/run_app.sh ${{ github.sha }}
