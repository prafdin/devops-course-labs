name: CD
on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: course.prafdin.ru
          username: light
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 2200
          script: |
            cd /home/light/catty-reminders-app
            git fetch origin lab2
            git checkout lab2
            git reset --hard origin/lab2
            echo "DEPLOY_REF=${{ github.sha }}" > .env
            source .venv/bin/activate
            pip install -r requirements.txt
            sudo systemctl restart catty-app
            sleep 5
