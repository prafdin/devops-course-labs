name: Deploy

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get commit hash
        run: echo "RELEASE_HASH=${{ github.sha }}" >> $GITHUB_ENV

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Run deploy script
        env:
          DEPLOY_HOST: course.prafdin.ru
          DEPLOY_USER: qzm
          DEPLOY_PORT: 22
          RELEASE_HASH: ${{ env.RELEASE_HASH }}
          IMAGE_NAME: ghcr.io/kuzminstanislav/catty-reminders-app
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
          GITHUB_ACTOR: ${{ secrets.GITHUB_ACTOR }}
        run: |
          chmod +x ./deploy.sh
          ./deploy.sh
