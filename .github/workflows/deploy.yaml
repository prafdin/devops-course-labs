name: CD Pipeline

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build and Publish project
      run: dotnet publish -c Release -o ./publish ExampleWebService/ExampleWebService.csproj

    - name: Copy files to VM via SCP
      uses: appleboy/scp-action@v1
      with:
        host: course.prafdin.ru
        port: 3111
        username: alexander
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        source: "publish/**"
        target: "/home/alexander/app"
        strip_components: 1

    # Подключение по SSH и запуск контейнера на целевом хосте
    - name: Deploy Docker container via SSH
      uses: appleboy/ssh-action@v1
      with:
        host: course.prafdin.ru
        port: 3111
        username: alexander
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          # Авторизация Docker в реестре GHCR
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          
          # Скачивание актуального образа из реестра
          docker pull ghcr.io/jupiter0303/csharp-example:${{ github.sha }}
          
          # Остановка и удаление старого контейнера
          docker stop csharp-web-container || true
          docker rm csharp-web-container || true
          
          # Запуск нового контейнера с передачей хэша коммита в переменные окружения
          docker run -d \
            -p 8181:8181 \
            --name csharp-web-container \
            -e DEPLOY_REF=${{ github.sha }} \
            --restart always \
            ghcr.io/jupiter0303/csharp-example:${{ github.sha }}
