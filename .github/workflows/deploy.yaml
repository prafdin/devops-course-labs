name: CD Pipeline

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Deploy to VM via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: course.prafdin.ru
        port: 3123
        username: rave
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          docker pull ghcr.io/zurmes/catty-reminders-app:latest
          docker stop catty-container || true
          docker rm catty-container || true
          docker run -d --name catty-container -p 8181:8181 -e DEPLOY_REF=${{ github.sha }} ghcr.io/zurmes/catty-reminders-app:latest
