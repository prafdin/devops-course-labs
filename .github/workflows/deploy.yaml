name: CD

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to deploy'
        required: true
        default: 'latest'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to VM via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: course.prafdin.ru
          port: 3175
          username: aleksandr
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            
            # Переменные
            REGISTRY="ghcr.io"
            IMAGE="$REGISTRY/${{ github.repository }}"
            TAG="${{ github.event.release.tag_name }}"
            
            # Если тег не указан, используем latest
            if [ -z "$TAG" ]; then
              TAG="latest"
            fi
            
            echo "=== Deploying Docker container ==="
            echo "Image: $IMAGE:$TAG"
            
            # Логин в GitHub Container Registry
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login $REGISTRY -u ${{ github.actor }} --password-stdin
            
            # Остановка и удаление старого контейнера
            docker stop catty-container 2>/dev/null || true
            docker rm catty-container 2>/dev/null || true
            
            # Удаление старого образа (опционально)
            docker rmi $IMAGE:$TAG 2>/dev/null || true
            
            # Pull нового образа
            docker pull $IMAGE:$TAG
            
            # Запуск нового контейнера
            docker run -d \
              --name catty-container \
              --restart unless-stopped \
              -p 8181:8181 \
              -e DEPLOY_REF="$TAG" \
              $IMAGE:$TAG
            
            # Проверка, что контейнер запустился
            sleep 3
            docker ps | grep catty-container
            
            # Проверка приложения
            curl -f http://localhost:8181/ || echo "App may not be ready yet"
            
            echo "=== Deployment completed ==="
