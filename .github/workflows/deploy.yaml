name: CD Deployment

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: course.prafdin.ru
          username: nightainted
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 3157
          script: |
            cd ~/catty-reminders-app
            git fetch origin
            git checkout lab2
            git pull origin lab2
            git reset --hard ${{ github.sha }}
            echo "DEPLOY_REF=${{ github.sha }}" > .env.deploy
            if [ ! -d ".venv" ]; then
                python3 -m venv .venv/
            fi
            source .venv/bin/activate
            pip install -r requirements.txt
            sudo systemctl restart catty-app.service
