name: Docker CD

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: course.prafdin.ru
          username: vboxuser
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 3181
          script: |
            docker pull ghcr.io/${{ github.repository }}:latest
            docker stop catty-app-container || true
            docker rm catty-app-container || true
            docker run -d --name catty-app-container -p 8181:8181 ghcr.io/${{ github.repository }}:latest
