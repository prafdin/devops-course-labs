name: CD Deployment

on:
  push:
    branches:
      - lab2
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1
        with:
          host: course.prafdin.ru
          username: nightainted
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/nightainted/catty-reminders-app
            
            git fetch origin
            git checkout lab2
            git pull origin lab2
            
            ./venv/bin/pip install -r requirements.txt
            
            echo "DEPLOY_REF=${{ github.sha }}" > .env
            
            sudo systemctl restart catty-app
            
