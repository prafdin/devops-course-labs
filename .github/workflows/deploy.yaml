name: Deploy

on:
  push:
    branches:
      - lab4
      - lab4_autotests*
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner.toLowerCase() }}/catty-reminders-app:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to server
        env:
          SERVER_HOST: ${{ vars.DEPLOY_HOST }}
          SERVER_USER: ${{ vars.DEPLOY_USER }}
          SERVER_PORT: ${{ vars.DEPLOY_PORT }}
          RELEASE_HASH: ${{ github.sha }}
          REPO_LOWER: ${{ github.repository_owner }}/catty-reminders-app
          APP_DIR: /home/${{ vars.DEPLOY_USER }}/Desktop/catty-reminders-app
        run: |
          scp -P $SERVER_PORT -o StrictHostKeyChecking=no docker-compose.yaml $SERVER_USER@$SERVER_HOST:$APP_DIR/docker-compose.yaml
          
          ssh -p $SERVER_PORT -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_HOST << EOF
            cd $APP_DIR
            echo "APP_IMAGE=ghcr.io/$REPO_LOWER:$RELEASE_HASH" > .env
            echo "RELEASE_HASH=$RELEASE_HASH" >> .env
            
            for i in {1..5}; do
              docker compose pull && break
              echo "Pull failed, waiting..."
              sleep 10
            done
            
            docker compose up -d --remove-orphans
          EOF
