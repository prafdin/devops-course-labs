name: CD

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: nyanya
          port: 3132
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            
            cd /home/nyanya/catty-reminders-app
            
            REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
            IMAGE_FULL="ghcr.io/${REPO_OWNER}/catty-reminders-app:${{ github.sha }}"
            
            # Обновляем IMAGE
            sed -i "s|^IMAGE=.*|IMAGE=${IMAGE_FULL}|" .env
            
            # Обновляем APP_IMAGE
            sed -i "s|^APP_IMAGE=.*|APP_IMAGE=${IMAGE_FULL}|" .env
            
            # Если APP_IMAGE не было, добавляем
            if ! grep -q "^APP_IMAGE=" .env; then
              echo "APP_IMAGE=${IMAGE_FULL}" >> .env
            fi
            
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            docker compose pull
            docker compose up -d --force-recreate --remove-orphans
            
            docker system prune -f
