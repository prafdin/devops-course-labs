name: CD

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Image Name
        id: prep
        run: echo "repo_lower=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: course.prafdin.ru
          username: light
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 3137
          script: |
            IMAGE_NAME="ghcr.io/${{ steps.prep.outputs.repo_lower }}:${{ github.sha }}"
            CONTAINER_NAME="catty-app"

            echo "Авторизация в GitHub Container Registry..."
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "Скачиваем образ $IMAGE_NAME..."
            docker pull $IMAGE_NAME

            echo "Останавливаем старый контейнер..."
            docker stop $CONTAINER_NAME || true
            docker rm -f $CONTAINER_NAME || true

            echo "Запускаем новый контейнер..."
            docker run -d \
              --name $CONTAINER_NAME \
              -p 8181:8181 \
              --restart always \
              $IMAGE_NAME

            echo "Очищаем старые неиспользуемые образы Docker..."
            docker image prune -af || true
