name: CD Pipeline

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Deploy to VM via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: course.prafdin.ru
        port: 3123
        username: rave
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          cd /home/rave/catty-reminders-app
          git fetch origin
          git checkout lab4
          git reset --hard origin/lab4
          docker stop catty-container || true
          docker rm catty-container || true
          docker compose down || true
          docker compose up -d
