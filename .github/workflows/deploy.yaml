name: CD Pipeline

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build and Publish project
      run: dotnet publish -c Release -o ./publish ExampleWebService/ExampleWebService.csproj

    - name: Copy files to VM via SCP
      uses: appleboy/scp-action@v1
      with:
        host: course.prafdin.ru
        port: 3111
        username: alexander
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        source: "publish/**"
        target: "/home/alexander/app"
        strip_components: 1

    # Подключение по SSH и запуск мультиконтейнерного стека через Docker Compose
    - name: Deploy Docker Compose stack via SSH
      uses: appleboy/ssh-action@v1
      with:
        host: course.prafdin.ru
        port: 3111
        username: alexander
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          # 1. Авторизуем Docker в реестре пакетов GHCR
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          
          # 2. Переходим в папку проекта и обновляем файлы (включая docker-compose.yml и .env)
          cd /home/alexander/csharp-example
          git pull origin lab4
          
          # 3. Скачиваем свежий образ приложения
          TAG=${{ github.sha }} docker-compose pull app
          
          # 4. Запускаем весь стек, передавая только тег образа
          TAG=${{ github.sha }} docker-compose up -d
