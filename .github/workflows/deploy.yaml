name: CD

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      
      - name: Add host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p 2200 course.prafdin.ru >> ~/.ssh/known_hosts 2>/dev/null
      
      - name: Deploy application
        env:
          DEPLOY_REF: ${{ github.sha }}
        run: |
          ssh -o StrictHostKeyChecking=no -p 2200 ${{ secrets.SSH_USER }}@course.prafdin.ru << 'EOF'
            set -e
            echo "Starting deployment..."
            cd /opt/catty-reminders || exit 1
            echo "Pulling latest code..."
            git fetch origin
            git reset --hard ${DEPLOY_REF}
            echo "Installing dependencies..."
            if [ -d "venv" ]; then
              ./venv/bin/pip install -r requirements.txt
            else
              python3 -m venv venv
              ./venv/bin/pip install -r requirements.txt
            fi
            echo "Restarting application..."
            sudo systemctl restart catty-reminders || sudo systemctl start catty-reminders
            echo "✅ Application deployed!"
          EOF
