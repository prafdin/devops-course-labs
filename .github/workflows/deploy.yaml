name: CD - Deploy to Server

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Executing remote ssh commands
        uses: appleboy/ssh-action@v1
        with:
          host: course.prafdin.ru
          username: qzm
          port: 3149
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/qzm/Desktop/catty-reminders-app
            chmod +x deploy.sh
            ./deploy.sh ${{ github.sha }}
