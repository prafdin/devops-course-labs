name: Deploy

on:
  push:
    branches:
      - lab4
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup SSH Agent
      uses: webfactory/ssh-agent@v0.7.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
    
    - name: Run deploy
      run: |
        scp -P 3149 -o StrictHostKeyChecking=no docker-compose.yaml qzm@course.prafdin.ru:/home/qzm/Desktop/catty-reminders-app/docker-compose.yaml
        ssh -p 3149 -o StrictHostKeyChecking=no qzm@course.prafdin.ru "bash /home/qzm/Desktop/catty-reminders-app/deploy.sh"
