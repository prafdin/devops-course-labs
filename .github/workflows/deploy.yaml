name: CD - Deploy to Server

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Executing remote ssh commands
        uses: appleboy/ssh-action@v1
        with:
          host: course.prafdin.ru
          username: qzm
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 3149
          script: |
            cd /home/qzm/Desktop/catty-reminders-app
            
            sudo git fetch --all
            sudo git reset --hard ${{ github.event.release.target_commitish || github.sha }}

            echo "DEPLOY_REF=${{ github.event.release.target_commitish || github.sha }}" | sudo tee .env
            sudo systemctl stop app.service
            sudo chmod 644 .env
            
            sudo fuser -k 8181/tcp || true
            
            sudo systemctl daemon-reload
            sudo systemctl start app.service
            sleep 10
