name: Deploy

on:
  push:
    branches:
      - lab3*

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H petrov.course.prafdin.ru >> ~/.ssh/known_hosts

      - name: Deploy app
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          IMAGE: ghcr.io/vadimkadkdoofjf/catty-reminders-app:${{ github.sha }}
          SHA: ${{ github.sha }}
        run: |
          ssh -o StrictHostKeyChecking=no -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" << EOF
            set -e

            echo "Pulling image: $IMAGE"
            docker pull $IMAGE

            echo "Stopping old container..."
            docker stop catty-app || true
            docker rm catty-app || true

            echo "Starting new container..."
            docker run -d \
              --name catty-app \
              --restart unless-stopped \
              -p 3155:8181 \
              -e DEPLOY_REF=$SHA \
              $IMAGE

            echo "Deploy successful: $SHA"
          EOF
