name: Deploy

on:
  push:
    branches:
      - lab4
      - lab4_autotests*

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      run: |
        REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        
        docker build -t ghcr.io/${REPO_LOWER}:${{ github.sha }} .
        docker push ghcr.io/${REPO_LOWER}:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Create .env file
      run: |
        IMAGE_LOWER=$(echo "ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ github.sha }}" | tr '[:upper:]' '[:lower:]')
        
        echo "APP_IMAGE=${IMAGE_LOWER}" > .env
        echo "DEPLOY_REF=${{ github.sha }}" >> .env
        echo "APP_PORT=8181" >> .env
        echo "APP_CONTAINER_NAME=catty-app" >> .env
        echo "DB_CONTAINER_NAME=catty_db" >> .env
        echo "MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD}}" >> .env
        echo "MYSQL_USER=ct" >> .env
        echo "MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD}}" >> .env
        echo "MYSQL_DATABASE=catty_reminders" >> .env
        echo "DB_PORT=3306" >> .env
    
    - name: Copy .env to server
      uses: appleboy/scp-action@master
      with:
        host: ${{ vars.DEPLOY_HOST }}
        username: ${{ vars.DEPLOY_USER }}
        port: ${{ vars.DEPLOY_PORT }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        source: ./.env
        target: /home/${{ vars.DEPLOY_USER }}/Desktop/catty-reminders-app
    
    - name: Copy docker-compose.yaml to server
      uses: appleboy/scp-action@master
      with:
        host: ${{ vars.DEPLOY_HOST }}
        username: ${{ vars.DEPLOY_USER }}
        port: ${{ vars.DEPLOY_PORT }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        source: ./docker-compose.yaml
        target: /home/${{ vars.DEPLOY_USER }}/Desktop/catty-reminders-app

    - name: Deploy to server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ vars.DEPLOY_HOST }}
        username: ${{ vars.DEPLOY_USER }}
        port: ${{ vars.DEPLOY_PORT }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          set -x
          cd /home/${{ vars.DEPLOY_USER }}/Desktop/catty-reminders-app
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin
          sudo docker compose up -d --pull always --remove-orphans --force-recreate
