name: Production Deployment

on:
  release:
    types: 
      - published

jobs:
  deploy-to-server:
    runs-on: ubuntu-latest
    
    steps:
    - name: Fetch repository contents
      uses: actions/checkout@v4
    
    - name: Extract Release Metadata
      id: release-info
      run: |
        REL_TAG="${{ github.event.release.tag_name }}"
        REL_BRANCH="${{ github.event.release.target_commitish }}"
        
        COMMIT_HASH=$(git rev-parse $REL_TAG^{commit} || git rev-list -n 1 $REL_TAG)
        
        echo "HASH=$COMMIT_HASH" >> $GITHUB_ENV
        echo "TAG=$REL_TAG" >> $GITHUB_ENV
        echo "BRANCH=$REL_BRANCH" >> $GITHUB_ENV
        
        echo "Target Tag: $REL_TAG"
        echo "Source Branch: $REL_BRANCH"
        echo "Resolved Hash: $COMMIT_HASH"
    
    - name: Authenticate SSH Key
      uses: webfactory/ssh-agent@v0.7.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
    
    - name: Trigger Remote Deploy Script
      env:
        DEPLOY_HOST: ${{ vars.SERVER_HOST }}
        DEPLOY_USER: ${{ vars.SERVER_USER }}
        DEPLOY_PORT: ${{ vars.SERVER_PORT }}
        RELEASE_HASH: ${{ env.HASH }}
        RELEASE_BRANCH: ${{ env.BRANCH }}
      run: |
        chmod +x ./scripts/deploy.sh
        bash ./scripts/deploy.sh