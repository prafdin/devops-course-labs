name: Deploy

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build on runner
        run: |
          python -m compileall app

      - name: Deploy through SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_SHA: ${{ github.sha }}
          SSH_HOST: course.prafdin.ru
          SSH_PORT: "26311"
          SSH_USER: root
          REPO_URL: https://github.com/an664/catty-reminders-app.git
        run: |
          set -Eeuo pipefail

          key_file="$(mktemp)"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          chmod 600 "$key_file"

          ssh -i "$key_file" \
            -p "$SSH_PORT" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            "$SSH_USER@$SSH_HOST" \
            "DEPLOY_SHA='$DEPLOY_SHA' REPO_URL='$REPO_URL' bash -s" <<'REMOTE'
          set -Eeuo pipefail

          BASE_DIR=/opt/catty-reminders-app
          APP_DIR=$BASE_DIR/current
          VENV_DIR=$BASE_DIR/venv

          mkdir -p "$BASE_DIR"

          if [ ! -d "$APP_DIR/.git" ]; then
            git clone --no-checkout "$REPO_URL" "$APP_DIR"
          fi

          git -C "$APP_DIR" remote set-url origin "$REPO_URL"
          git -C "$APP_DIR" fetch --prune origin \
            '+refs/heads/*:refs/remotes/origin/*' \
            '+refs/tags/*:refs/tags/*'
          git -C "$APP_DIR" checkout --force "$DEPLOY_SHA"
          git -C "$APP_DIR" clean -fd

          python3 -m venv "$VENV_DIR"
          "$VENV_DIR/bin/python" -m pip install --upgrade pip setuptools wheel
          "$VENV_DIR/bin/pip" install -r "$APP_DIR/requirements.txt"

          printf 'DEPLOY_REF=%s\nPYTHONUNBUFFERED=1\n' "$DEPLOY_SHA" > /etc/catty-app.env
          systemctl restart catty-reminders-app.service
          REMOTE
