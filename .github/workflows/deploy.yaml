name: CD Pipeline

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Deploy to VM via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: course.prafdin.ru
        port: 3123
        username: rave
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          cd /home/rave/catty-reminders-app
          git fetch origin
          git checkout lab2
          git reset --hard origin/lab2
          echo "DEPLOY_REF=${{ github.sha }}" > .env
          sudo systemctl restart catty.service
