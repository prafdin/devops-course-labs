name: CD

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Deploy via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 3137
        script: |
          cd /home/light/catty-reminders-app
          git fetch origin lab2
          git checkout lab2
          git reset --hard origin/lab2
          
          # Записываем хэш коммита в .env
          echo "DEPLOY_REF=$(git rev-parse HEAD)" > /home/light/catty-reminders-app/.env
          
          source /home/light/catty-reminders-app/.venv/bin/activate
          pip install -r requirements.txt
          sudo systemctl restart catty-app
