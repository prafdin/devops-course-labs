name: Deploy

on:
  push:
    branches:
      - lab4
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup SSH
      uses: webfactory/ssh-agent@v0.7.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Deploy
      env:
        SERVER_HOST: course.prafdin.ru
        SERVER_USER: qzm
        SERVER_PORT: 3149
        APP_DIR: /home/qzm/Desktop/catty-reminders-app
      run: |
        scp -P $SERVER_PORT -o StrictHostKeyChecking=no docker-compose.yaml $SERVER_USER@$SERVER_HOST:$APP_DIR/docker-compose.yaml
        
        ssh -p $SERVER_PORT -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_HOST << EOF
          cd $APP_DIR
          echo "APP_IMAGE=ghcr.io/kuzminstanislav/catty-reminders-app:${{ github.sha }}" > .env
          echo "DEPLOY_REF=${{ github.sha }}" >> .env
          echo "APP_PORT=8181" >> .env
          echo "APP_CONTAINER_NAME=catty-app" >> .env
          echo "DB_CONTAINER_NAME=catty_db" >> .env
          echo "MYSQL_ROOT_PASSWORD=root_pass_123" >> .env
          echo "MYSQL_USER=ct" >> .env
          echo "MYSQL_PASSWORD=catty_pass_123" >> .env
          echo "MYSQL_DATABASE=catty_reminders" >> .env
          echo "DB_PORT=3306" >> .env
          
          docker compose pull
          docker compose up -d --remove-orphans
        EOF
