name: CD

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Prepare Image Name
        id: prep
        run: |
          echo "repo_lower=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
          echo "release_sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Remote Docker Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: course.prafdin.ru
          username: semen
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 3122
          command_timeout: 20m
          script: |
            IMAGE="ghcr.io/${{ steps.prep.outputs.repo_lower }}:${{ steps.prep.outputs.release_sha }}"
            CONTAINER_NAME="catty-container"

            echo "Pulling image: $IMAGE"

            i=1
            until docker pull "$IMAGE"; do
              if [ "$i" -ge 5 ]; then
                echo "Docker pull failed after $i attempts"
                exit 1
              fi
              echo "Docker pull failed, retry $i/5 in 15 seconds..."
              i=$((i+1))
              sleep 15
            done

            docker stop "$CONTAINER_NAME" || true
            docker rm "$CONTAINER_NAME" || true

            docker run -d \
              --name "$CONTAINER_NAME" \
              -p 8181:8181 \
              --restart unless-stopped \
              -e DEPLOY_REF=${{ steps.prep.outputs.release_sha }} \
              "$IMAGE"

            docker image prune -f
