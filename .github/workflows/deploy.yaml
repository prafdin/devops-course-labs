name: CD

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Image Name
        id: prep
       run: echo "repo_lower=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Remote Docker Compose Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: course.prafdin.ru
          username: timoha 
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 3129       
          script: |
            cd /home/timoha/Desktop/devops
            
            git fetch origin
            git reset --hard origin/lab4
            
            export APP_IMAGE="ghcr.io/${{ steps.prep.outputs.repo_lower }}:latest"
            export MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}
            export MYSQL_DATABASE="catty_reminders"
            
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            docker compose up -d --pull always --remove-orphans --force-recreate
            
            docker image prune -f
