name: Deploy

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get release commit hash
        run: |
          TAG=${{ github.event.release.tag_name }}
          HASH=$(git rev-list -n 1 $TAG)
          echo "RELEASE_HASH=$HASH" >> $GITHUB_ENV

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy with Docker on VM
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          IMAGE_TAG: ghcr.io/${{ github.repository }}:${{ env.RELEASE_HASH }}
        run: |
          ssh -o StrictHostKeyChecking=no -p $DEPLOY_PORT $DEPLOY_USER@$DEPLOY_HOST << 'EOF'
            # Вход на VM
            echo "Logging into GitHub Container Registry"
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "Pulling image $IMAGE_TAG"
            docker pull $IMAGE_TAG

            echo "Stopping and removing old container (if exists)"
            docker stop my-app || true
            docker rm my-app || true

            echo "Starting new container on port 8181"
            docker run -d --name my-app -p 8181:8181 --restart always $IMAGE_TAG

            echo "Check container status"
            sleep 3
            if docker ps --filter "name=my-app" --filter "status=running" | grep my-app; then
              echo "Deployment successful"
            else
              echo "Deployment failed"
              exit 1
            fi
          EOF
