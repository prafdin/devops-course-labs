name: Deploy

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get release commit hash
        run: |
          TAG=${{ github.event.release.tag_name }}
          HASH=$(git rev-list -n 1 $TAG)
          echo "RELEASE_HASH=$HASH" >> $GITHUB_ENV

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          RELEASE_HASH: ${{ env.RELEASE_HASH }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          ssh -p "$SERVER_PORT" \
            -o StrictHostKeyChecking=no \
            "$SERVER_USER@$SERVER_HOST" \
            "RELEASE_HASH=$RELEASE_HASH GHCR_USER=$GHCR_USER GHCR_TOKEN=$GHCR_TOKEN bash -s" << 'EOF'

set -e

APP_DIR="/home/vboxuser/catty-reminders-app"
cd "$APP_DIR"

echo "Deploying $RELEASE_HASH"

echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

docker-compose down || true

docker pull ghcr.io/vadimkadkdoofjf/catty-reminders-app:$RELEASE_HASH

docker-compose up -d --force-recreate

docker image prune -af || true

docker ps

EOF
