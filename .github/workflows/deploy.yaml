name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

  release:
    types:
      - published

jobs:
  deploy:
    if: ${{ github.event_name == 'release' || github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest

    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: course.prafdin.ru
          port: 3155
          username: vboxuser
          key: ${{ secrets.SSH_PRIVATE_KEY }}

          script: |
            set -e

            cd /home/vboxuser/catty-reminders-app

            git fetch origin
            git checkout lab4
            git pull origin lab4

            DEPLOY_REF="${{ github.event.workflow_run.head_sha || github.sha }}"
            IMAGE="ghcr.io/vadimkadkdoofjf/catty-reminders-app:${DEPLOY_REF}"

            cat > .env <<EOF
            DEPLOY_REF=${DEPLOY_REF}
            IMAGE=${IMAGE}
            EOF

            echo "${{ secrets.GITHUB_TOKEN }}" | sudo docker login ghcr.io \
              -u vadimkadkdoofjf \
              --password-stdin

            sudo docker compose pull app

            sudo docker compose up -d --force-recreate app

            sleep 10

            curl -f http://127.0.0.1:8181/
