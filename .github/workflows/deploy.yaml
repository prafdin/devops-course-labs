name: Deploy

on:
  push:
    branches:
      - lab4
      - lab4_autotests*
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase owner
        run: |
          echo "OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Login to Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ env.OWNER_LC }}/catty-reminders-app:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Deploy
        env:
          SERVER_HOST: ${{ vars.DEPLOY_HOST }}
          SERVER_USER: ${{ vars.DEPLOY_USER }}
          SERVER_PORT: ${{ vars.DEPLOY_PORT }}
          APP_DIR: /home/${{ vars.DEPLOY_USER }}/Desktop/catty-reminders-app
        run: |
          scp -P $SERVER_PORT -o StrictHostKeyChecking=no docker-compose.yaml $SERVER_USER@$SERVER_HOST:$APP_DIR/docker-compose.yaml
          ssh -p $SERVER_PORT -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_HOST << EOF
            cd $APP_DIR
            echo "${{ secrets.MY_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            echo "APP_IMAGE=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/catty-reminders-app:${{ github.sha }}" > .env
            echo "DEPLOY_REF=${{ github.sha }}" >> .env
            echo "APP_PORT=8181" >> .env
            echo "APP_CONTAINER_NAME=catty-app" >> .env
            echo "DB_CONTAINER_NAME=catty_db" >> .env
            echo "MYSQL_ROOT_PASSWORD=root_pass_123" >> .env
            echo "MYSQL_USER=ct" >> .env
            echo "MYSQL_PASSWORD=catty_pass_123" >> .env
            echo "MYSQL_DATABASE=catty_reminders" >> .env
            echo "DB_PORT=3306" >> .env
            sudo docker compose up -d --pull always --remove-orphans --force-recreate
          EOF
