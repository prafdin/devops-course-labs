name: CD

on:
  push:
    branches: [ lab4 ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Image Name
        id: prep
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "repo_lower=${REPO_LOWER}" >> $GITHUB_OUTPUT

      - name: Remote Docker Compose Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: course.prafdin.ru
          username: qzm
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 3129
          script: |
            cd /home/qzm/Desktop/catty-reminders-app
            
            git fetch origin
            git reset --hard origin/lab4
            
            export APP_IMAGE="ghcr.io/${{ steps.prep.outputs.repo_lower }}:latest"
            export MYSQL_ROOT_PASSWORD="mypass"
            export MYSQL_DATABASE="catty_reminders"
            
            echo "${{ secrets.GITHUB_TOKEN }}" | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            sudo docker compose up -d --pull always --remove-orphans --force-recreate
            
            sudo docker image prune -f
