name: CD

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VM via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: course.prafdin.ru
          port: 3178
          username: user
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            docker stop catty-container || true
            docker rm catty-container || true
            docker pull ghcr.io/seredovasophia/catty-reminders-app:latest
            docker run -d --name catty-container -p 8181:8181 ghcr.io/seredovasophia/catty-reminders-app:latest
