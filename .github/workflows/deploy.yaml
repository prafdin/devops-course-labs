name: Deploy

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via Docker Compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: course.prafdin.ru
          username: password-123
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 3121
          script: |
            cd ~/catty-reminders-app
            git pull origin lab4 --rebase
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ghcr.io/sofiastepanova/catty-reminders-app:${{ github.sha }}
            docker tag ghcr.io/sofiastepanova/catty-reminders-app:${{ github.sha }} ghcr.io/sofiastepanova/catty-reminders-app:lab4
            docker compose up -d --remove-orphans
