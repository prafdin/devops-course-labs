name: CD Pipeline

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: catty-deployment
  cancel-in-progress: false

env:
  SSH_HOST: course.prafdin.space
  SSH_PORT: "3137"
  SSH_USER: light
  DEPLOY_DIR: /home/light/catty-app

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout released commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Validate Compose configuration
        env:
          DEPLOY_REF: ${{ github.sha }}
        run: docker compose config --quiet

      - name: Copy Compose configuration
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.SSH_HOST }}
          port: ${{ env.SSH_PORT }}
          username: ${{ env.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: docker-compose.yaml
          target: ${{ env.DEPLOY_DIR }}

      - name: Deploy released image
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_REF: ${{ github.sha }}
          GHCR_USER: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GHCR_PAT }}
        with:
          host: ${{ env.SSH_HOST }}
          port: ${{ env.SSH_PORT }}
          username: ${{ env.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DEPLOY_REF,DEPLOY_DIR,GHCR_USER,GHCR_TOKEN
          script_stop: true
          script: |
            set -eu
            cd "$DEPLOY_DIR"
            export DEPLOY_REF
            docker compose config --quiet
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose pull
            docker compose up --detach --wait --wait-timeout 180
            curl -fsS http://127.0.0.1:8181/login | grep -F "content=\"$DEPLOY_REF\""
            docker compose ps
