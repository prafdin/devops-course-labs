name: Deploy

on:
  release:
    types: [published, created]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Get release commit hash
      id: release_vars
      run: |
        TAG=${{ github.event.release.tag_name }}
        HASH=$(git rev-parse "$TAG^{commit}" 2>/dev/null || git rev-parse "$TAG")
        echo "RELEASE_HASH=$HASH" >> $GITHUB_ENV
    
    - name: Setup SSH Agent
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
    
    - name: Add SSH known hosts
      run: |
        mkdir -p ~/.ssh
        ssh-keyscan -p ${{ vars.DEPLOY_PORT || 22 }} ${{ vars.DEPLOY_HOST }} >> ~/.ssh/known_hosts
    
    - name: Deploy to server
      env:
        DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
        RELEASE_HASH: ${{ env.RELEASE_HASH }}
        IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}
        DOCKER_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_ACTOR: ${{ github.actor }}
      run: |
        chmod +x deploy.sh
        ./deploy.sh
