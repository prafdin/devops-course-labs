name: Deploy

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Get release info
        run: |
          TAG=${{ github.event.release.tag_name }}
          HASH=$(git rev-list -n 1 $TAG)

          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "HASH=$HASH" >> $GITHUB_ENV

          echo "Deploying tag: $TAG"
          echo "Commit hash: $HASH"

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy via SSH
        env:
          HOST: ${{ vars.DEPLOY_HOST }}
          USER: ${{ vars.DEPLOY_USER }}
          PORT: ${{ vars.DEPLOY_PORT }}
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}
          HASH: ${{ env.HASH }}
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.DOCKER_TOKEN }}

        run: |
          ssh -p $PORT -o StrictHostKeyChecking=no $USER@$HOST << EOF
            set -e

            CONTAINER=catty-app-container
            IMAGE=$IMAGE_NAME:$HASH

            echo "Deploying image: $IMAGE"

            echo "$TOKEN" | sudo docker login ghcr.io -u "$ACTOR" --password-stdin

            echo "Pulling image..."
            sudo docker pull $IMAGE

            echo "Stopping old container..."
            sudo docker stop $CONTAINER || true
            sudo docker rm $CONTAINER || true

            echo "Starting new container..."
            sudo docker run -d \
              --name $CONTAINER \
              -p 80:8181 \
              --restart unless-stopped \
              $IMAGE

            sleep 5

            echo "Container status:"
            sudo docker ps

            echo "Logs:"
            sudo docker logs $CONTAINER --tail 50

            if sudo docker ps | grep -q $CONTAINER; then
              echo "Deployment successful"
            else
              echo "Deployment failed"
              sudo docker logs $CONTAINER
              exit 1
            fi
          EOF
