name: CD - Deploy to Server

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Executing remote ssh commands
        uses: appleboy/ssh-action@v1
        with:
          host: course.prafdin.ru
          username: qzm
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 3149
          script: |
            cd /home/qzm/Desktop/catty-reminders-app
            
            sudo git fetch --all
            sudo git reset --hard ${{ github.sha }}

            echo "${{ github.sha }}" | sudo tee version.txt
            echo "${{ github.sha }}" | sudo tee app/version.txt
            echo "DEPLOY_REF=${{ github.sha }}" | sudo tee .env
            echo "DEPLOY_REF=${{ github.sha }}" | sudo tee app/.env
            
            sudo fuser -k 8181/tcp || true
            sudo pkill -9 -f uvicorn || true
            
            if [ -f "requirements.txt" ]; then
                sudo /home/qzm/Desktop/catty-reminders-app/.venv/bin/pip install -r requirements.txt
            fi
            
            sudo systemctl daemon-reload
            sudo systemctl restart app.service
