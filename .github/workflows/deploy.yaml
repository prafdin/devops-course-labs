name: CD

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare Image Name
        id: prep
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "repo_lower=${REPO_LOWER}" >> $GITHUB_OUTPUT

      - name: Remote to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: course.prafdin.ru
          username: aleksandr
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 3175
          request_pty: true
          script: |
            set -e
            cd /home/aleksandr/catty-reminders-app
            echo "DEPLOY_REF=${{ github.sha }}" > .env
            echo "Logging in to GHCR..."
            echo "${{ secrets.DOCKER_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            sudo docker compose up -d --pull always --remove-orphans --force-recreate
