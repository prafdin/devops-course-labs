name: Deploy

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Get release hash
        run: |
          TAG=${{ github.event.release.tag_name }}
          HASH=$(git rev-list -n 1 $TAG)
          echo "RELEASE_HASH=$HASH" >> $GITHUB_ENV

      - uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Upload compose
        run: |
          scp -P ${{ secrets.SERVER_PORT }} docker-compose.yaml \
          vboxuser@${{ secrets.SERVER_HOST }}:/home/vboxuser/catty-reminders-app/docker-compose.yaml

      - name: Deploy
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: vboxuser
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          RELEASE_HASH: ${{ env.RELEASE_HASH }}
          REPO_NAME: ${{ github.repository }}
        run: |
          chmod +x deploy.sh
          ./deploy.sh
