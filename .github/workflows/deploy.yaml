name: CD

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: pip install -r requirements.txt

    - name: Install Playwright browsers
      run: playwright install --with-deps chromium

    - name: Run tests
      run: pytest

    - name: Deploy via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 3137
        script: |
          cd /home/light/catty-reminders-app
          git fetch origin lab2
          git checkout lab2
          git reset --hard origin/lab2
          
          # Записываем хэш коммита в .env
          echo "DEPLOY_REF=$(git rev-parse HEAD)" > /home/light/catty-reminders-app/.env
          
          source /home/light/catty-reminders-app/.venv/bin/activate
          pip install -r requirements.txt
          sudo systemctl restart catty-app
          sleep 5
          /home/light/catty-reminders-app/test.sh
