name: CD

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Извлекаем точный хэш коммита релиза
      - name: Get config details
        run: |
          echo "COMMIT_SHA=$(git rev-parse HEAD)" >> $GITHUB_ENV

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          DEPLOY_REF: ${{ env.COMMIT_SHA }}
        with:
          host: "course.prafdin.ru"
          username: "kali"
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 2258
          envs: GITHUB_TOKEN,GITHUB_ACTOR,DEPLOY_REF
          script: |
            cd /home/kali/catty-reminders-app
            bash scripts/deploy.sh
#
