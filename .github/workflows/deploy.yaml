name: Deploy Workflow

on:
  release:
    types: [published, created]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH Action
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          port: ${{ vars.DEPLOY_PORT || 22 }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            IMAGE_TAG=${{ github.sha }}
            
            echo "> Trying to pull: ghcr.io/${{ github.repository_owner }}/catty-reminders-app:$IMAGE_TAG"
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin || true
            docker pull ghcr.io/${{ github.repository_owner }}/catty-reminders-app:$IMAGE_TAG
            docker stop catty-app || true
            docker rm catty-app || true
            
            docker run -d \
              --name catty-app \
              -p 8181:8181 \
              --restart always \
              -e DEPLOY_REF=$IMAGE_TAG \
              ghcr.io/${{ github.repository_owner }}/catty-reminders-app:$IMAGE_TAG
            
            echo "> Deploy of $IMAGE_TAG successful!"
