name: CD - Deploy to Server

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Executing remote ssh commands
        uses: appleboy/ssh-action@v1
        with:
          host: course.prafdin.ru
          username: qzm
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 3149
          script: |
            cd /home/qzm/Desktop/catty-reminders-app
            
            sudo git fetch --all
            sudo git reset --hard ${{ github.event.release.target_commitish || github.sha }}

            DEPLOY_REF=$(git rev-parse HEAD)
            echo "DEPLOY_REF=$DEPLOY_REF" | sudo tee .env.deploy
            sudo chmod 644 .env.deploy

            sudo systemctl daemon-reload
            sudo systemctl restart app.service
            
            sleep 5
            if sudo systemctl is-active --quiet app.service; then
                echo "Success"
            else
                echo "Error"
                exit 1
            fi
