name: Deploy
on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: course.prafdin.ru
          username: dima
          port: 3105
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            bash -c '
              set -e
              cd /home/dima/catty-reminders-app
              OWNER=$(echo "${{ github.repository_owner }}" | tr "[:upper:]" "[:lower:]")
              
              export IMAGE=ghcr.io/$OWNER/catty-reminders-app:${{ github.sha }}
              export APP_CONTAINER_NAME=catty-app
              export DB_CONTAINER_NAME=catty-db
              export MARIADB_ROOT_PASSWORD=${{ secrets.MARIADB_ROOT_PASSWORD }}
              export MARIADB_PASSWORD=${{ secrets.MARIADB_PASSWORD }}
              export MARIADB_USER=${{ secrets.MARIADB_USER }}
              export MARIADB_DATABASE=catty_reminders
              export HOST_APP_PORT=8181
              export CONTAINER_APP_PORT=8181
              export HOST_DB_PORT=3306
              export CONTAINER_DB_PORT=3306
              
              echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
              docker compose up -d --pull always --remove-orphans --force-recreate
            '

