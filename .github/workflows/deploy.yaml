name: CD Deployment

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: nightainted
          key: ${{ secrets.KEY }}
          port: 3157
          script: |
            cd /home/nightainted/catty-reminders-app
            
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            export DEPLOY_REF=${{ github.sha }}
            export IMAGE=ghcr.io/${{ github.repository }}:${{ github.sha }}
            
            docker compose pull
            docker compose up -d --remove-orphans
            
            docker image prune -f
