name: Deploy

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known_hosts
        run: |
          ssh-keyscan -p 3155 petrov.course.prafdin.ru >> ~/.ssh/known_hosts

      - name: Deploy application
        run: |
          ssh -p 3155 vboxuser@petrov.course.prafdin.ru << EOF
            set -e

            mkdir -p ~/catty-reminders-app
            cd ~/catty-reminders-app

            cat > docker-compose.yml << COMPOSE
            services:
              db:
                image: mariadb:11
                container_name: catty-db
                restart: always
                environment:
                  MARIADB_ROOT_PASSWORD: ${{ secrets.DB_PASS }}
                  MARIADB_DATABASE: catty
                  MARIADB_USER: vboxuser
                  MARIADB_PASSWORD: ctpass
                ports:
                  - "3306:3306"
                volumes:
                  - db_data:/var/lib/mysql

              app:
                image: ghcr.io/${{ github.repository_owner }}/catty-reminders-app:${{ github.sha }}
                container_name: catty-app
                restart: always
                depends_on:
                  - db
                environment:
                  RELEASE_HASH: ${{ github.sha }}
                  DB_HOST: db
                  DB_PORT: 3306
                  DB_NAME: catty
                  DB_USER: vboxuser
                  DB_PASS: ctpass
                ports:
                  - "8181:8181"

            volumes:
              db_data:
            COMPOSE

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
              -u ${{ github.actor }} \
              --password-stdin

            IMAGE="ghcr.io/${{ github.repository_owner }}/catty-reminders-app:${{ github.sha }}"

            echo "Pulling image: \$IMAGE"

            for i in 1 2 3 4 5; do
              docker pull "\$IMAGE" && break

              echo "Pull failed. Retry \$i..."
              sleep 10
            done

            docker pull mariadb:11

            docker compose down || true

            docker compose up -d --force-recreate --remove-orphans

            docker image prune -af || true

            docker ps
          EOF
