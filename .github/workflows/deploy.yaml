name: Deploy to Server

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Prepare image name
        id: prep
        run: echo "repo_lower=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
      
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: course.prafdin.ru
          username: nyanya
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            IMAGE="ghcr.io/${{ steps.prep.outputs.repo_lower }}:latest"
            CONTAINER_NAME="catty-container"
            
            # Логинимся в GitHub Container Registry
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Скачиваем свежий образ
            docker pull $IMAGE
            
            # Удаляем старый контейнер, если есть
            docker stop $CONTAINER_NAME || true
            docker rm $CONTAINER_NAME || true
            
            # Запускаем новый контейнер
            docker run -d \
              --name $CONTAINER_NAME \
              -p 8181:8181 \
              --restart unless-stopped \
              -e DEPLOY_REF=${{ github.sha }} \
              $IMAGE
            
            # Чистим мусор
            docker image prune -f
