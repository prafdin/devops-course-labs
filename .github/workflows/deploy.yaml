name: CD

on:
  release:
    types: [published]
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches:
      - 'lab4'

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'lab4') }}
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: course.prafdin.ru
          port: 3306
          username: qzm
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd /home/qzm/Desktop/catty-reminders-app || exit 1
            
            git fetch origin
            git checkout lab4 || true
            git pull origin lab4 || true
            
            if [ -d reminder_db.json ]; then sudo rm -rf reminder_db.json; fi
            if [ ! -f reminder_db.json ]; then echo "{}" > reminder_db.json; fi
            
            TARGET_SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
            
            echo "IMAGE=ghcr.io/kuzminstanislav/catty-reminders-app:$TARGET_SHA" > .env
            
            echo "${{ secrets.GITHUB_TOKEN }}" | sudo docker login ghcr.io -u KuzminStanislav --password-stdin
            
            sudo docker compose pull
            
            sudo docker compose --env-file .env down || true
            sudo docker compose --env-file .env up -d --remove-orphans --force-recreate
            
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8181/ >/dev/null || curl -s http://127.0.0.1:8181/login | grep -q "Method Not Allowed" || curl -I http://127.0.0.1:8181/login 2>&1 | grep -q "405"; then
                echo "App is healthy and responds correctly"
                exit 0
              fi
              echo "Waiting for app... ($i/30)"
              sleep 3
            done
            
            echo "App failed"
            sudo docker compose logs app
            exit 1
