name: CD - Deploy to Server

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Executing remote ssh commands
        uses: appleboy/ssh-action@v1
        with:
          host: course.prafdin.ru
          username: qzm
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 3149
          script: |
            cd ~/Desktop/catty-reminders-app
            NEW_SHA=${{ github.event.release.target_commitish }}
            
            git fetch origin
            
            if git show origin/$NEW_SHA:requirements.txt > /dev/null 2>&1; then
                git checkout -B $NEW_SHA origin/$NEW_SHA
                git reset --hard origin/$NEW_SHA
            fi

            echo "$NEW_SHA" > version.txt
            echo "$NEW_SHA" > app/version.txt
            echo "DEPLOY_REF=$NEW_SHA" > .env
            echo "DEPLOY_REF=$NEW_SHA" > app/.env
            
            if [ -f "requirements.txt" ]; then
                if [ ! -d ".venv" ]; then python3 -m venv .venv; fi
                source .venv/bin/activate
                pip install -r requirements.txt
            fi
            
            sudo systemctl restart app.service
