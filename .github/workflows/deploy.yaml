name: CD - Deploy to Debian

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: course.prafdin.ru
          username: vboxuser
          port: 2200
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            IMAGE=ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:${{ github.sha }}

            echo "Using image: $IMAGE"

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker pull $IMAGE

            docker stop catty-app-container || true
            docker rm catty-app-container || true

            docker run -d \
              --name catty-app-container \
              -p 8181:8181 \
              --restart always \
              $IMAGE

            sleep 5

            docker ps

            if docker ps | grep -q catty-app-container; then
              echo "Deployment successful!"
            else
              echo "Deployment failed!"
              docker logs catty-app-container
              exit 1
            fi
