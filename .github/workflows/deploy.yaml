name: CD Pipeline

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      packages: read
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Prepare Image Name
      id: prep
      run: echo "repo_lower=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

    - name: Deploy to Server via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.SSH_PORT }}
        script: |
          cd /home/Roman/Desktop/catty-reminders-app
          
          IMAGE_NAME="ghcr.io/${{ steps.prep.outputs.repo_lower }}:latest"
          DEPLOY_SHA="${{ github.sha }}"

          echo "Logging in to GHCR..."
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin

          echo "Updating images with Docker Compose..."
          sudo IMAGE=$IMAGE_NAME DEPLOY_REF=$DEPLOY_SHA docker compose pull

          echo "Restarting stack..."
          sudo IMAGE=$IMAGE_NAME DEPLOY_REF=$DEPLOY_SHA docker compose up -d --remove-orphans

          echo "Cleaning up old images..."
          sudo docker image prune -f