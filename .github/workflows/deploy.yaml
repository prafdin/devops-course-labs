name: CI/CD Pipeline

on:
  push:
    branches:
      - lab4
      - lab4_autotests*

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase image name
        run: |
          IMAGE_NAME=$(echo "ghcr.io/${{ github.repository_owner }}/catty-reminders-app" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
      packages: read
    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Execute remote deploy
        run: |
          IMAGE_LOWER=$(echo "ghcr.io/${{ github.repository_owner }}/catty-reminders-app:${{ github.sha }}" | tr '[:upper:]' '[:lower:]')
          
          ssh -T -p ${{ vars.DEPLOY_PORT }} -o StrictHostKeyChecking=no ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }} << EOF
            cd /home/${{ vars.DEPLOY_USER }}/Desktop/catty-reminders-app
            
            echo "${{ secrets.GITHUB_TOKEN }}" | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            echo "APP_IMAGE=\$IMAGE_LOWER" > .env
            echo "DB_CONTAINER_NAME=catty_db" >> .env
            echo "APP_CONTAINER_NAME=catty-app" >> .env
            echo "MYSQL_ROOT_PASSWORD=root_pass_123" >> .env
            echo "MYSQL_USER=ct" >> .env
            echo "MYSQL_PASSWORD=catty_pass_123" >> .env
            echo "MYSQL_DATABASE=catty_reminders" >> .env
            
            sudo docker compose pull
            sudo docker compose up -d --remove-orphans --force-recreate
          EOF
