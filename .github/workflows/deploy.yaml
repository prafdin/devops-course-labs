name: CD

on:
  push:
    branches:
      - '**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: course.prafdin.ru
          port: 3155
          username: vboxuser
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd /home/vboxuser/catty-reminders-app || exit 1
            
            eval "$(ssh-agent -s)"
            if [ -f /home/vboxuser/.ssh/id_rsa ]; then
              ssh-add /home/vboxuser/.ssh/id_rsa
            elif [ -f /home/vboxuser/.ssh/id_ed25519 ]; then
              ssh-add /home/vboxuser/.ssh/id_ed25519
            fi
            export GIT_SSH_COMMAND="ssh -o StrictHostKeyChecking=no"
            
            git fetch origin
            git checkout ${{ github.ref_name }} || git checkout lab4 || true
            git pull origin ${{ github.ref_name }} || git pull origin lab4 || true
            
            TARGET_SHA="${{ github.sha }}"
            
            echo "IMAGE=ghcr.io/vadimkadkdoofjf/catty-reminders-app:$TARGET_SHA" > .env
            
            echo "${{ secrets.GITHUB_TOKEN }}" | sudo docker login ghcr.io -u vadimkadkdoofjf --password-stdin
            
            sudo docker compose pull app
            
            sudo docker compose --env-file .env up -d app
            
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8181/ >/dev/null || curl -s http://127.0.0.1:8181/login | grep -q "Method Not Allowed" || curl -I http://127.0.0.1:8181/login 2>&1 | grep -q "405"; then
                echo "App is healthy and responds correctly"
                exit 0
              fi
              echo "Waiting for app... ($i/30)"
              sleep 3
            done
            
            echo "App failed to start"
            sudo docker compose logs app
            exit 1
