name: Docker CD Deployment

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Deploy via SSH Tunnel to Kali VM
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: course.prafdin.ru
        port: 2258
        username: kali
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          cd ~/catty-reminders-app
          
          git fetch origin lab3 || git fetch origin main
          git reset --hard FETCH_HEAD
          
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          
          docker pull ghcr.io/${{ github.repository }}:${{ github.sha }}
          
          docker stop catty-test || true
          docker rm catty-test || true
          
          docker run -d \
            -p 8181:8181 \
            --name catty-test \
            --env-file .env \
            -e DEPLOY_REF=${{ github.sha }} \
            --restart unless-stopped \
            ghcr.io/${{ github.repository }}:${{ github.sha }}
