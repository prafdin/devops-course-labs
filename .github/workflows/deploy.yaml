name: CD Workflow
on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via script
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: course.prafdin.ru
          username: vboxuser
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 3181
          script: |
            echo "=== Deploy triggered ==="
            echo "Full SHA from GitHub: ${{ github.sha }}"
            bash /home/vboxuser/catty-reminders-app/run_app.sh ${{ github.sha }}
