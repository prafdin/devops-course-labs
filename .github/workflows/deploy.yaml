name: Deploy

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build on runner
        run: |
          docker build --build-arg DEPLOY_REF=${{ github.sha }} -t ghcr.io/an664/catty-reminders-app:${{ github.sha }} .

      - name: Deploy through SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_SHA: ${{ github.sha }}
          SSH_HOST: course.prafdin.ru
          SSH_PORT: "26311"
          SSH_USER: root
          IMAGE: ghcr.io/an664/catty-reminders-app:${{ github.sha }}
        run: |
          set -Eeuo pipefail

          key_file="$(mktemp)"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          chmod 600 "$key_file"

          ssh -i "$key_file" \
            -p "$SSH_PORT" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            "$SSH_USER@$SSH_HOST" \
            "DEPLOY_SHA='$DEPLOY_SHA' IMAGE='$IMAGE' GHCR_TOKEN='$GHCR_TOKEN' bash -s" <<'REMOTE'
          set -Eeuo pipefail

          printf '%s\n' "$GHCR_TOKEN" | docker login ghcr.io -u an664 --password-stdin
          docker pull "$IMAGE"

          systemctl stop catty-reminders-app.service || true
          systemctl disable catty-reminders-app.service || true

          docker rm -f catty-reminders-app catty-reminders-app-app-1 || true
          docker run -d \
            --name catty-reminders-app \
            --restart always \
            -p 8181:8181 \
            "$IMAGE"
          REMOTE
