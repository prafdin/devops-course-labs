name: CD Pipeline

on:
  release:
    types: [published] # <-- Обязательно пробел после двоеточия!

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy files via scp
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "."
          target: "/home/${{ secrets.SERVER_USER }}/app"

      - name: Execute deployment script
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/${{ secrets.SERVER_USER }}/app
            
            # Подготавливаем файл переменных окружения, если его нет
            if [ ! -f .env ]; then
                cp .env.example .env
            fi
            
            # Создаем изолированное окружение для Python (чтобы не сломать систему)
            python3 -m venv venv
            source venv/bin/activate
            
            # Устанавливаем зависимости
            pip install --upgrade pip
            pip install -r requirements.txt
            
            # Убиваем старый процесс на порту 8181
            sudo fuser -k 8181/tcp || true
            
            # Запускаем FastAPI через uvicorn в фоне без режима --reload (для продакшена)
            nohup uvicorn app.main:app --host 0.0.0.0 --port 8181 > app.log 2>&1 &
            
            echo "Deployment to $SERVER_HOST successful!"