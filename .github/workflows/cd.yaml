name: CD Pipeline

on:
  release:
    types: [published] 

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy files via scp
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "."
          target: "/home/${{ secrets.SERVER_USER }}/app"

      - name: Execute deployment script
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/${{ secrets.SERVER_USER }}/app
            
            if [ ! -f .env ]; then
                cp .env.example .env
            fi

            sed -i '/^DEPLOY_REF=/d' .env || true
            echo "DEPLOY_REF=$(echo ${{ github.sha }})" >> .env

            python3 -m venv venv
            source venv/bin/activate
            
            pip install --upgrade pip
            pip install -r requirements.txt
            
            sudo fuser -k 8181/tcp || true
            
            nohup uvicorn app.main:app --host 0.0.0.0 --port 8181 > app.log 2>&1 &
            
            echo "Deployment to $SERVER_HOST successful!"