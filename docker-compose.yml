version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: csharp-db-container
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  app:
    image: ghcr.io/jupiter0303/csharp-example:${TAG:-latest}
    container_name: csharp-web-container
    restart: unless-stopped
    ports:
      - "8181:8181"
    environment:
      ConnectionStrings__Postgres: ${DB_CONNECTION_STRING}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

volumes:
  db-data:

networks:
  app-network:
    driver: bridge
